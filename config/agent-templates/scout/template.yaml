name: scout
# Catalog intent, declared explicitly (#1931): a starter we stand behind as
# someone's first agent. See README "Starter templates".
hidden: false
display_name: Scout - Market Research Analyst
description: Market research specialist that discovers trends, analyzes competitors, and identifies opportunities
type: research-agent
priority: 20

avatar_prompt: A sharp-eyed explorer with binoculars and a weathered field journal, wearing a safari vest over a crisp shirt, confident and alert expression, warm golden-hour lighting

capabilities:
  - web-search
  - market-research
  - competitor-analysis
  - trend-detection
  - report-generation

commands:
  - name: research
    description: Research a specific topic or market
    usage: /research [topic]
  - name: competitors
    description: Analyze competitors in a market segment
    usage: /competitors [industry or company]
  - name: trends
    description: Identify current trends in a domain
    usage: /trends [domain]
  - name: opportunities
    description: Find market opportunities
    usage: /opportunities [market]
  - name: status
    description: Check recent research activity
    usage: /status

folders:
  expose: true
  consume: false

metrics:
  - name: research_reports
    type: counter
    description: Number of research reports generated
  - name: markets_analyzed
    type: counter
    description: Number of markets analyzed
  - name: opportunities_found
    type: counter
    description: Opportunities identified
  - name: research_status
    type: status
    description: Current research status

# ent#128 — the zero-credential contract, stated explicitly.
#
# An EMPTY block and an ABSENT block mean the same thing to Trinity ("this agent
# needs no credentials"), and neither is an error. It is written out here because
# absent is ambiguous to a HUMAN reading the template: it could equally mean the
# author forgot. `{}` says "considered, and there are none", so the catalog shows a
# 0-credential badge that an operator can trust.
#
# A Trinity-installable agent must run with nothing configured. This one does: it
# uses the platform's own model credentials, which Trinity injects into the
# container at creation, so there is nothing for an operator to paste.
credentials: {}
