name: sage
# Catalog intent, declared explicitly (#1931): a starter we stand behind as
# someone's first agent. See README "Starter templates".
hidden: false
display_name: Sage - Strategic Advisor
description: Strategic advisor that synthesizes research and provides actionable recommendations
type: strategy-agent
priority: 20

avatar_prompt: A wise elder advisor in a tailored charcoal suit, silver-haired with knowing eyes, seated in a mahogany-paneled study surrounded by strategic frameworks and books, warm authoritative presence

capabilities:
  - strategic-analysis
  - synthesis
  - recommendation-engine
  - framework-application
  - decision-support

commands:
  - name: analyze
    description: Analyze a strategic question or situation
    usage: /analyze [question or situation]
  - name: recommend
    description: Provide recommendations for a decision
    usage: /recommend [decision context]
  - name: framework
    description: Apply a strategic framework (SWOT, Porter's, etc.)
    usage: /framework [framework-name] [subject]
  - name: briefing
    description: Generate executive briefing from recent research
    usage: /briefing [topic]
  - name: request-research
    description: Ask Scout to research a specific topic
    usage: /request-research [topic]

folders:
  expose: true
  consume: true

metrics:
  - name: strategies_developed
    type: counter
    description: Number of strategies developed
  - name: recommendations_made
    type: counter
    description: Recommendations provided
  - name: briefings_generated
    type: counter
    description: Executive briefings created
  - name: analysis_status
    type: status
    description: Current analysis status

# ent#128 — the zero-credential contract, stated explicitly.
#
# An EMPTY block and an ABSENT block mean the same thing to Trinity ("this agent
# needs no credentials"), and neither is an error. It is written out here because
# absent is ambiguous to a HUMAN reading the template: it could equally mean the
# author forgot. `{}` says "considered, and there are none", so the catalog shows a
# 0-credential badge that an operator can trust.
#
# A Trinity-installable agent must run with nothing configured. This one does: it
# uses the platform's own model credentials, which Trinity injects into the
# container at creation, so there is nothing for an operator to paste.
credentials: {}
