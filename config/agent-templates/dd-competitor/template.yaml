name: dd-competitor
# Excluded from the user-facing template catalog (GET /api/templates). See
# README "Not starting points". Demo fleet, not a starter — deploy the whole
# set with config/manifests/vc-due-diligence.yaml. (#1931)
hidden: true
display_name: DD Competitor Agent
description: Competitive landscape mapping, market share analysis, and threat assessment
tagline: Know thy enemy
version: "1.0.0"
author: Trinity VC Demo

avatar_prompt: A sharp competitive strategist in a dark suit, studying a wall of competitor profiles and market maps, intense focused gaze, modern war-room setting with screens and charts

resources:
  cpu: "2"
  memory: "4g"

capabilities:
  - competitive-intelligence
  - market-mapping
  - funding-analysis
  - threat-assessment

use_cases:
  - "Map direct and indirect competitors"
  - "Compare funding and traction levels"
  - "Identify competitive moats"
  - "Assess big tech threat"

shared_folders:
  expose: true
  consume: true

metrics:
  - name: competitors_analyzed
    type: counter
    label: "Competitors Analyzed"
    description: "Total competitors researched"

  - name: research_status
    type: status
    label: "Status"
    description: "Current research status"
    values:
      - value: "researching"
        color: "blue"
        label: "Researching"
      - value: "idle"
        color: "gray"
        label: "Idle"
