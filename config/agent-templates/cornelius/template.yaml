# Trinity-Compatible Agent Configuration
# Cornelius - The Insight Harvester & Second Brain Partner

# Required Fields
name: cornelius
display_name: "Cornelius"
type: knowledge-base
description: |
  AI Insight Harvester and Second Brain Partner managing a personal Obsidian knowledge base.

  Core capabilities:
  - Problem-Solving & Advice: Ground advice in accumulated KB insights and personal frameworks
  - Insight Harvesting: Detect and capture original thinking, personal frameworks, and distinctive viewpoints
  - Knowledge Synthesis: Combine captured insights to create new content or discover patterns
  - Deep Research: Autonomous pipeline for discovering, extracting, and integrating cutting-edge research
  - Connection Discovery: Find non-obvious relationships between notes across domains
  - Dialectic Analysis: Stress-test ideas with committed positions and structural contradiction analysis
  - Content Generation: Create articles and perspectives grounded in knowledge base

resources:
  cpu: "2"
  memory: "4g"

# Optional Metadata
version: "1.25.0"
author: "Trinity"
updated: "2026-03-12"
tagline: "Your insight harvester, second brain partner, and KB-grounded advisor"

# Rendered above the fold as clickable prompts ("What You Can Ask"), so each entry
# must be something this bundle can actually do. The two semantic-search lookups
# were removed: they prefilled a task the keyword floor cannot serve
# (they return with trinity-enterprise#173).
use_cases:
  - "Get KB-grounded advice on problems using your own frameworks"
  - "Look up knowledge in your vault by keyword"
  - "Extract unique insights from conversations and transcripts"
  - "Discover hidden connections between notes in your knowledge base"
  - "Generate articles and content from accumulated knowledge"
  - "Research a topic on the web and fold the findings into your vault"
  - "Stress-test an idea by arguing both sides, then synthesizing"
  - "Graduate notes through Zettelkasten workflow"
  - "Analyze and understand your knowledge base structure"

# Only what this bundle actually does. The semantic tier (semantic_search,
# spreading_activation, usage_based_learning) needs resources/local-brain-search/,
# which this template does not ship — the .trinity/brain-orb/search hook therefore
# serves its keyword floor. Those tokens return with the stack itself
# (trinity-enterprise#173).
# `brain-orb` is load-bearing: the frontend route guard reads it from /info.
capabilities:
  - brain-orb
  - insight_extraction
  - connection_discovery
  - knowledge_synthesis
  - content_generation
  - problem_solving
  - dialectic_analysis
  - deep_research
  - current_affairs_analysis
  - belief_system_management
  - epub_processing
  - diagram_generation
  - image_generation

# Credential Schema
credentials:
  mcp_servers:
    aistudio:
      env_vars:
        - GEMINI_API_KEY
    trinity:
      env_vars:
        - TRINITY_API_KEY
  env_file:
    - VAULT_BASE_PATH
    - DOCUMENT_INSIGHTS_PATH
    - TRINITY_REMOTE_AGENT

# Sub-Agents — intentionally none.
# This bundle ships no .claude/agents/. The upstream agent's sub-agents depend on
# resources/local-brain-search/ and on MCP servers this template does not configure
# (smart-connections, mcp-server-chart, apollo), so declaring them here rendered a
# clickable delegation in the Info tab that resolved to nothing.
# They return with the search stack (trinity-enterprise#173).

# Skills (Slash Commands) — intentionally none.
# This bundle ships no .claude/skills/. The upstream agent's skills shell out to
# resources/local-brain-search/run_*.sh or call MCP servers this template does not
# configure, so every entry here named a slash command that did not exist.
# They return with the search stack (trinity-enterprise#173).

# MCP Servers
mcp_servers:
  - name: mermaid-diagram
    description: "Generate Mermaid diagrams (PNG/SVG) from markdown"
  - name: aistudio
    description: "Gemini AI for content generation and Google search grounding"
  - name: ebook-mcp
    description: "EPUB and PDF processing for ebook content extraction"
# This list must match .mcp.json.template exactly (compatibility check X-004).
# `playwright` was declared but never configured there.
# `trinity` is injected into .mcp.json by the platform at start — it is a runtime
# server, not a template one, so it is not declared here; the credential schema
# above still carries its TRINITY_API_KEY.

# Git Configuration
git:
  push_enabled: true
  commit_paths:
    - memory/
    - plans/
    - Brain/
    - outputs/
  ignore_paths:
    - .mcp.json
    - .env
    - .trinity/
    - .claude/commands/trinity/
    - resources/local-brain-search/data/

# Planning Configuration
planning:
  enabled: true
  max_active_plans: 5
  default_task_timeout_minutes: 60
  auto_checkpoint: true

# Shared Folders (for inter-agent collaboration)
shared_folders:
  expose: true
  consume: true

# Custom Metrics
metrics:
  - name: notes_total
    type: gauge
    label: "Total Notes"
    description: "Total number of notes in the knowledge base"
    unit: "notes"
  - name: permanent_notes
    type: gauge
    label: "Permanent Notes"
    description: "Core atomic insights (02-Permanent + AI Extracted)"
    unit: "notes"
  - name: document_insights
    type: gauge
    label: "Document Insights"
    description: "Research session extractions"
    unit: "notes"
  - name: insights_extracted
    type: counter
    label: "Insights Extracted"
    description: "Number of insights extracted this session"
    unit: "insights"
  - name: connections_discovered
    type: counter
    label: "Connections Found"
    description: "Number of connections discovered this session"
    unit: "connections"
  - name: search_queries
    type: counter
    label: "Search Queries"
    description: "Number of vault searches performed"
    unit: "queries"
# Removed with the stack they measured: index_status (local FAISS index),
# memory_learning (usage-based learning), advice_requests (/advise).
# They return with trinity-enterprise#173.
