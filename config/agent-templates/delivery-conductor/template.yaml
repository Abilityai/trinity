name: delivery-conductor
# A reusable runtime scaffold, intentionally excluded from the starter catalog.
hidden: true
display_name: Delivery Conductor
description: Generic agent-owned conductor scaffold for bounded, recoverable delivery ticks.
version: "1.0.0"
author: Trinity Platform

# Runtime state is durable but remains outside the source workspace history.
data_paths:
  - data/**

# Trinity supplies these generic wake and handoff capabilities. No schedule is
# installed by default; adopters configure their own wake policy.
capabilities:
  - events
  - reminders
  - executions
  - chat

# This template deliberately asks for no repository credentials or external MCP
# clients. Trinity injects its own capability surface at runtime.
mcp_servers: []
credentials: {}

# The controller may hand off at most one reserved action through this closed
# capability-to-tool map. The model cannot select any other effect surface.
conductor:
  allowed_effect_tools:
    - mcp__trinity__chat_with_agent
    - mcp__trinity__set_reminder
  capability_tool_map:
    chat: mcp__trinity__chat_with_agent
    reminders: mcp__trinity__set_reminder
  wake_provenance:
    trust_boundary: model-mediated-system-prompt
    execution_id_env: TRINITY_EXECUTION_ID
    digest_domain: delivery-conductor-wake-v1
    trigger_source_map:
      manual: direct
      chat: direct
      schedule: schedule
      reminder: reminder
      event: worker-completion
    worker_event_types:
      - agent.task.completed
      - agent.task.failed
