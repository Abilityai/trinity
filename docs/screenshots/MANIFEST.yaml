# Canonical Trinity screenshot store — the single source of truth.
#
# Every UI screenshot referenced by docs/ or README.md lives in this directory and
# has exactly one entry below. Nothing else in the repo stores UI screenshots.
#
#   Refresh:  /capture-screenshots  (writes here, then updates captured_at + captured_commit)
#   Verify:   python3 scripts/ci/check_screenshots.py
#
# Fields
#   file            filename in this directory (flat, no subdirectories)
#   title           human label for the surface
#   route           URL path on a running instance, so a refresh lands on the same screen
#   shows           what the image must depict — the recapture brief
#   sources         frontend files whose change makes this screenshot stale.
#                   The freshness check compares the newest commit date over these
#                   paths against captured_at. Empty list = never goes stale from our
#                   releases (see external: true).
#   captured_at     ISO date the image was captured
#   captured_commit commit the capture was taken at ("unknown" for pre-manifest images)
#   external        true = not Trinity's own UI (a third-party screen); freshness skipped
#
# The one deliberate exception to this store: release-note screenshots under
# docs/assets/screenshots/whats-new/<version>/ are frozen point-in-time snapshots and
# must NEVER be refreshed — see that directory's README.md.

version: 1

viewport:
  width: 1440
  height: 900
  device_scale_factor: 2
  theme: dark

