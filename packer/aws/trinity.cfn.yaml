AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Trinity (the operating system for the AI-native company) on one EC2 instance: the Trinity AMI,
  a security group for HTTPS, and an Elastic IP. Open the TrinityUrl output
  and enter the InstanceId output when /setup asks for it. (#3004)

# Long-form intrinsics (Ref:, Fn::GetAtt:) rather than the !Ref short form, so
# the template parses as plain YAML in the repo's tests.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: {default: Instance}
        Parameters: [ImageId, InstanceType]
      - Label: {default: Optional network placement}
        Parameters: [VpcId, SubnetId]
      - Label: {default: Optional SSH access}
        Parameters: [KeyName, SshCidr]

Parameters:
  ImageId:
    Type: AWS::EC2::Image::Id
    Description: >-
      The Trinity AMI for this region (packer/aws/README.md lists the current
      one; the Launch Stack link fills it in).
  InstanceType:
    Type: String
    Default: t3a.large
    AllowedValues: [t3a.large, t3.large, m7i-flex.large, t3a.xlarge, t3.xlarge, m7i-flex.xlarge]
    Description: 8 GiB of memory is the minimum Trinity is sized for.
  VpcId:
    Type: String
    Default: ""
    Description: >-
      Optional VPC id (vpc-...). Leave blank to use the region's default VPC.
      Required when SubnetId is set: the security group must be in the
      subnet's VPC.
  SubnetId:
    Type: String
    Default: ""
    Description: >-
      Optional subnet id (subnet-...) in VpcId. Leave blank for a default
      subnet of the default VPC. The instance gets a public IPv4 address either
      way.
  KeyName:
    Type: String
    Default: ""
    Description: Optional EC2 key pair name for SSH. Leave blank for no key.
  SshCidr:
    Type: String
    Default: ""
    AllowedPattern: "^$|^([0-9]{1,3}\\.){3}[0-9]{1,3}/([0-9]|[1-2][0-9]|3[0-2])$"
    Description: >-
      Optional address range allowed to reach SSH (port 22), e.g. 203.0.113.4/32.
      Leave blank to keep port 22 closed.

Rules:
  SubnetNeedsItsVpc:
    RuleCondition:
      Fn::Not: [{Fn::Equals: [{Ref: SubnetId}, ""]}]
    Assertions:
      - Assert:
          Fn::Not: [{Fn::Equals: [{Ref: VpcId}, ""]}]
        AssertDescription: Set VpcId to the VPC that contains SubnetId.

Conditions:
  HasVpcId:
    Fn::Not: [{Fn::Equals: [{Ref: VpcId}, ""]}]
  HasSubnetId:
    Fn::Not: [{Fn::Equals: [{Ref: SubnetId}, ""]}]
  HasKeyName:
    Fn::Not: [{Fn::Equals: [{Ref: KeyName}, ""]}]
  HasSshCidr:
    Fn::Not: [{Fn::Equals: [{Ref: SshCidr}, ""]}]

Resources:
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Trinity - HTTPS, plus HTTP for the certificate challenge and redirect
      VpcId:
        Fn::If: [HasVpcId, {Ref: VpcId}, {Ref: "AWS::NoValue"}]
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0}
        - {IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0}

  SshIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: HasSshCidr
    Properties:
      GroupId: {"Fn::GetAtt": [SecurityGroup, GroupId]}
      IpProtocol: tcp
      FromPort: 22
      ToPort: 22
      CidrIp: {Ref: SshCidr}

  Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: {Ref: ImageId}
      InstanceType: {Ref: InstanceType}
      KeyName:
        Fn::If: [HasKeyName, {Ref: KeyName}, {Ref: "AWS::NoValue"}]
      # A public IPv4 whatever the subnet's auto-assign setting, so first boot
      # can read its address and obtain the certificate before the Elastic IP
      # attaches (the refresh timer then moves to the Elastic IP).
      NetworkInterfaces:
        - DeviceIndex: "0"
          AssociatePublicIpAddress: true
          GroupSet:
            - {"Fn::GetAtt": [SecurityGroup, GroupId]}
          SubnetId:
            Fn::If: [HasSubnetId, {Ref: SubnetId}, {Ref: "AWS::NoValue"}]
      Tags:
        - {Key: Name, Value: {Ref: "AWS::StackName"}}

  # The Elastic IP can attach after first boot has already read the temporary
  # address; the instance's refresh timer re-applies the new one within
  # minutes (PROV-019).
  ElasticIp:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      InstanceId: {Ref: Instance}

Outputs:
  TrinityUrl:
    Description: Open this once the instance has finished its first boot (a few minutes).
    Value:
      Fn::Join: ["", ["https://", {Ref: ElasticIp}, "/"]]
  InstanceId:
    Description: The setup page asks for this ID before it creates the admin account.
    Value: {Ref: Instance}
