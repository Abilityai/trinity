# Trinity agent sshd policy (trinity-enterprise#1168).
#
# Installed as /etc/ssh/sshd_config.d/10-trinity.conf. Debian's sshd_config
# reads `Include /etc/ssh/sshd_config.d/*.conf` BEFORE its own directives, and
# sshd keeps the first value it sees, so these win over the main file without
# editing it. The image build asserts the EFFECTIVE values with `sshd -T`
# (see the Dockerfile), so a Debian change that stopped this file applying
# fails the build instead of silently reopening password auth.
#
# Key-based auth is the only method (#1615). The `developer` account has a
# locked password (`passwd -l`); UsePAM yes (Debian's default, restated here
# on purpose) is what lets a locked account still log in by key.
PasswordAuthentication no
KbdInteractiveAuthentication no
ChallengeResponseAuthentication no
PermitEmptyPasswords no
PermitRootLogin no
PubkeyAuthentication yes
UsePAM yes
