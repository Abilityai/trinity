# Issue #549: HSTS only when the upstream TLS terminator signals HTTPS via
# X-Forwarded-Proto. This nginx listens on :8080 inside the container (#874,
# unprivileged nginx) with host-side port 80 mapping in docker-compose.prod.yml,
# and TLS is terminated upstream by cloudflare / traefik / external LB — so
# $scheme is always "http" here. An empty $hsts_header value tells the
# `add_header` directive to emit nothing.
map $http_x_forwarded_proto $hsts_header {
    default "";
    https   "max-age=31536000; includeSubDomains";
}

server {
    # Issue #874: nginxinc/nginx-unprivileged binds ≥1024 (no NET_BIND_SERVICE
    # capability needed). Host port 80 mapping lives in docker-compose.prod.yml.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # File upload support (#364): 3 files × 5 MB base64-encoded ≈ ~21 MB JSON
    client_max_body_size 25m;

    # Strip server version from responses
    server_tokens off;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml;
    gzip_comp_level 6;

    # Security headers (shared include — see security-headers.conf for details)
    include /etc/nginx/security-headers.conf;

    # Proxy API requests to backend
    location /api/ {
        proxy_pass http://trinity-backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;

        # SSE (Server-Sent Events) support - required for live execution streaming
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }

    # A2A inbound server (trinity-enterprise#157) — the public well-known Agent
    # Card + JSON-RPC/SSE task endpoint live on the backend at /a2a/. External
    # orchestrators reach Trinity through this front door (not :8000 directly),
    # so /a2a/ must be proxied like /api/ (SSE support for message/stream).
    location /a2a/ {
        proxy_pass http://trinity-backend:8000/a2a/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;

        # SSE (message/stream) — no buffering so events flush immediately.
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }

    # Trinity MCP server (#2281 / hosted installs). The MCP server listens on
    # its own container port 8080, and until now that port was the ONLY way to
    # reach it — nothing proxied `/mcp`. That is fine while every port is
    # published on 0.0.0.0, and breaks the moment an install exposes only
    # 80/443, which is exactly what the DigitalOcean 1-Click does: Caddy has a
    # single `reverse_proxy` pointed at this nginx, so an external MCP client
    # (`https://<host>/mcp`) had nowhere to land and the platform's headline
    # integration silently did not exist on a marketplace droplet.
    #
    # Proxied like /a2a/ rather than /api/: both are external-facing front
    # doors onto a non-backend upstream, and both stream.
    #
    # `trinity-mcp-server` resolves on the agent network, which this container
    # shares with it — verified in docker-compose{,.prod,.hosted}.yml, all three
    # of which define that container_name. (The sibling compose has no frontend,
    # so nginx never runs there.) nginx resolves upstreams at startup, so a
    # compose file that ships this frontend WITHOUT an mcp-server would fail to
    # boot rather than 502 — hence the check across all three.
    location /mcp {
        proxy_pass http://trinity-mcp-server:8080/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;

        # Streamable HTTP. The transport is the STATEFUL httpStream branch, so
        # a session is a long-lived SSE response keyed by `Mcp-Session-Id`;
        # buffering it would hold events until the buffer filled and make the
        # session look hung. Same reasoning as /api/ and /a2a/.
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }

    # WebSocket support
    location /ws {
        proxy_pass http://trinity-backend:8000/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    # SPA routing - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    # NOTE: include is required here — nginx drops server-level add_header
    # when a location block defines its own add_header directives.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/security-headers.conf;
    }

    # Don't cache index.html
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        include /etc/nginx/security-headers.conf;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
        include /etc/nginx/security-headers.conf;
    }
}
