# Issue #549: HSTS only when the upstream TLS terminator signals HTTPS via
# X-Forwarded-Proto. This nginx listens on :8080 inside the container (#874,
# unprivileged nginx) with host-side port 80 mapping in docker-compose.prod.yml,
# and TLS is terminated upstream by cloudflare / traefik / external LB — so
# $scheme is always "http" here. An empty $hsts_header value tells the
# `add_header` directive to emit nothing.
map $http_x_forwarded_proto $hsts_header {
    default "";
    https   "max-age=31536000; includeSubDomains";
}

# abilityai/trinity#3215: forward the scheme the CLIENT used, not this hop's.
# $scheme is always "http" here (see above), so `X-Forwarded-Proto $scheme`
# clobbered the upstream terminator's "https" before the backend ever saw it —
# which is how the x402 402's `resource.url` ended up http on a TLS install,
# minting buyer tokens for a URL the buyer never calls. Preserve an upstream
# https; otherwise fall back to this hop's own scheme, which is what every
# proxied location sent before.
map $http_x_forwarded_proto $fwd_proto {
    default $scheme;
    https   https;
}

# Two listeners, one set of routes (trinity-enterprise#873). The server body is
# shared through nginx-server.conf so the two can never drift.
#
# THIS FILE IS A TEMPLATE. render-nginx.sh substitutes exactly one variable,
# TRINITY_PROXY_GATEWAY, at container start (every nginx `$variable` below is
# left alone) and writes the result where nginx reads it.

# The ordinary listener. Issue #874: nginxinc/nginx-unprivileged binds ≥1024
# (no NET_BIND_SERVICE capability needed). Host port 80 mapping lives in
# docker-compose.prod.yml. $remote_addr is the TCP peer, never a header.
server {
    listen 8080;
    include /etc/nginx/nginx-server.conf;
}

# The protected listener, for a reverse proxy on the SAME HOST (the Caddy that
# `start.sh --provision` installs). Docker's port publishing replaces every
# caller's address with the bridge gateway, so Caddy states the client address
# in a PROXY protocol v2 header instead. That header is believed ONLY from the
# gateway — the address host-local connections to the loopback-published port
# arrive from — and a connection without one is refused. Published on
# 127.0.0.1 only, so neither off-box callers nor agents can reach it.
server {
    listen 8082 proxy_protocol;
    set_real_ip_from ${TRINITY_PROXY_GATEWAY};
    real_ip_header proxy_protocol;
    real_ip_recursive off;
    include /etc/nginx/nginx-server.conf;
}
