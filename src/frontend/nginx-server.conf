# Shared contents of BOTH frontend server blocks (trinity-enterprise#873).
# nginx.conf defines two listeners that must serve identical routes and
# security headers — the ordinary :8080 and the PROXY-protocol :8082 — so their
# body lives here once and each `server {}` includes it. A location added to
# only one listener would silently exist for some clients and not others.
#
# The listeners differ only in where $remote_addr comes from. On :8080 it is
# the TCP peer. On :8082 it is the client address carried in the PROXY header,
# accepted only from the bridge gateway (a Caddy on the host dialling the
# loopback-published port). Either way every proxied location APPENDS it to
# X-Forwarded-For ($proxy_add_x_forwarded_for), and the backend reads only the
# right-hand entries its trusted proxies appended (src/backend/utils/client_ip.py).
# X-Real-IP is still sent for compatibility but the backend never reads it.

    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # File upload support (#364): 3 files × 5 MB base64-encoded ≈ ~21 MB JSON
    client_max_body_size 25m;

    # Strip server version from responses
    server_tokens off;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml;
    gzip_comp_level 6;

    # Security headers (shared include — see security-headers.conf for details)
    include /etc/nginx/security-headers.conf;

    # Proxy API requests to backend
    location /api/ {
        proxy_pass http://trinity-backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;

        # SSE (Server-Sent Events) support - required for live execution streaming
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }

    # AAuth discovery documents (trinity-enterprise#623, prototype) — agent
    # provider metadata, its JWKS and resource metadata, served by the backend.
    # They answer 404 unless the prototype flag is on; a peer fetches them from
    # the issuer origin, so they must be reachable at the origin root.
    # Headers mirror /a2a/ below: the mapped $fwd_proto, never $scheme (#3215 —
    # this hop is always http behind the TLS terminator).
    location ^~ /.well-known/aauth- {
        proxy_pass http://trinity-backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }

    # A2A inbound server (trinity-enterprise#157) — the public well-known Agent
    # Card + JSON-RPC/SSE task endpoint live on the backend at /a2a/. External
    # orchestrators reach Trinity through this front door (not :8000 directly),
    # so /a2a/ must be proxied like /api/ (SSE support for message/stream).
    location /a2a/ {
        proxy_pass http://trinity-backend:8000/a2a/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_read_timeout 86400;

        # SSE (message/stream) — no buffering so events flush immediately.
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }

    # Trinity MCP server (#2281 / hosted installs). The MCP server listens on
    # its own container port 8080, and until now that port was the ONLY way to
    # reach it — nothing proxied `/mcp`. That is fine while every port is
    # published on 0.0.0.0, and breaks the moment an install exposes only
    # 80/443, which is exactly what the DigitalOcean 1-Click does: Caddy has a
    # single `reverse_proxy` pointed at this nginx, so an external MCP client
    # (`https://<host>/mcp`) had nowhere to land and the platform's headline
    # integration silently did not exist on a marketplace droplet.
    #
    # Proxied like /a2a/ rather than /api/: both are external-facing front
    # doors onto a non-backend upstream, and both stream.
    #
    # `trinity-mcp-server` resolves on the ingress network (prod/hosted,
    # trinity-enterprise#873), which both this container and the MCP server
    # join — verified in docker-compose.prod.yml and docker-compose.hosted.yml,
    # which define that container_name. (The dev compose serves the UI from
    # Vite, and the sibling compose has no frontend, so this nginx never runs
    # there.) nginx resolves upstreams at startup, so a compose file that ships
    # this frontend WITHOUT an mcp-server would fail to boot rather than 502.
    location /mcp {
        proxy_pass http://trinity-mcp-server:8080/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_read_timeout 86400;

        # Streamable HTTP. The transport is the STATEFUL httpStream branch, so
        # a session is a long-lived SSE response keyed by `Mcp-Session-Id`;
        # buffering it would hold events until the buffer filled and make the
        # session look hung. Same reasoning as /api/ and /a2a/.
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }

    # WebSocket support
    # trinity-enterprise#873: the same forwarding headers as every other
    # backend location. Without them a WebSocket handshake reached the backend
    # carrying no client identity, so it was attributed to this proxy.
    location /ws {
        proxy_pass http://trinity-backend:8000/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_read_timeout 86400;
    }

    # SPA routing - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    # NOTE: include is required here — nginx drops server-level add_header
    # when a location block defines its own add_header directives.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/security-headers.conf;
    }

    # Don't cache index.html
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        include /etc/nginx/security-headers.conf;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
        include /etc/nginx/security-headers.conf;
    }
