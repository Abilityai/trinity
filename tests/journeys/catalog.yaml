    owner: operator
    invariants: [G-01]

  - id: J03
    issue: 2342
    promise: "I can create an agent with no configuration and get a useful answer."
    actor: user
    lanes: [local, digitalocean]
    tier: journey-smoke
    # PARTIALLY built (#2336): the create/stop/start half runs on every PR; the
    # first-turn half is credential-bound and skips with an allowlisted reason.
    # `built` stays false because the promise is "a useful ANSWER", and the half
    # that asserts an answer is the half that does not run.
    # No path yet ON THIS BRANCH: the harness lands with #2403 (Rails R1+R2),
    # which is open. Recording a path that resolves nowhere is the same lie as
    # an invented invariant id, and the validator caught exactly that on its
    # first run — so the field stays null until the file is here, and gains the
    # path in the commit that merges it.
    harness: null
    built: false
    owner: operator
    invariants: [E-05]

