[pytest]
# Don't look for conftest files in parent directories
norecursedirs = ..

# This file wins the rootdir for `pytest tests/unit`, so a marker registered only
# in pyproject.toml is inert here (#2434). Registering it where it is actually
# read keeps `-m requires_postgres` from warning on every CI run — the tier's
# fail-loud property is pytest's exit-5 on an empty selection, and a warning
# stream that is always noisy is where a typo'd marker would hide.
markers =
    requires_postgres: the assertion can only FAIL on PostgreSQL — schema-parity CI runs these with TEST_POSTGRES_URL set (#2434)
