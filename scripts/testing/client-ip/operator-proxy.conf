# An operator's own load balancer in front of Trinity's nginx (path D of the
# trinity-enterprise#873 proof harness). It APPENDS the address it saw, which is
# what TRUSTED_PROXIES requires of a trusted proxy.
server {
    listen 8088;
    location / {
        proxy_pass http://UPSTREAM;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
