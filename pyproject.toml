[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
# #2080: nothing may hang a run. `thread` (not the default `signal`) because
# the signal method re-enters the interpreter from a signal handler, which on
# a hung socket read produced a pytest INTERNALERROR instead of a timeout —
# the failure that turned one blocking test into an indefinite stall. The
# ceiling is generous on purpose: per-tier timeouts in tests/run-full.sh are
# the real budget, and this is only the backstop for someone running pytest by
# hand.
timeout = 900
timeout_method = "thread"
pythonpath = ["tests", "src/backend", "src"]
markers = [
    "asyncio: mark test as async",
    "smoke: mark test as smoke test (fast, no agent)",
    "slow: mark test as slow running (chat execution)",
    "requires_agent: test requires a running agent",
    "unit: unit tests that don't need backend",
    "integration: mark test as integration test",
    "journey: a promise the platform makes to a person, tested end to end against a live stack (#2335)",
]
