name: backend-unit-test

# Per-PR unit-suite regression gate (issue #715).
#
# Runs the backend unit suite under three pytest-randomly seeds against both
# `base` (the PR's target branch tip) and `head` (the PR's merge commit), then
# diffs the union of failing test IDs. Fails the check if `head` introduces
# any new failing test ID that was not failing in `base` under any seed, or
# if any pytest run produced no JUnit XML (fail-closed on infra failure).
#
# Issue #802: also runs on push to dev/main so baseline-style invariant checks
# (lint-sys-modules) fire post-merge — catches the case where two PRs both
# pass their pre-merge CI but the merge of one invalidates the baseline the
# other landed. The per-PR diff jobs (test, diff) only run on pull_request
# since there's no base/head to compare on a push.
#
# Trigger manually via the Actions tab (workflow_dispatch) for backfill.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: backend-unit-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-sys-modules:
    # Issue #762: prevent NEW bare sys.modules mutations in tests/.
    # Stdlib-only AST check; baseline-ratcheted to permit pre-existing
    # violations without blocking unrelated PRs.
    name: lint (sys.modules pollution check)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Run sys.modules lint
        run: python tests/lint_sys_modules.py

  test:
    name: pytest (${{ matrix.side }}, seed ${{ matrix.seed }})
    # Per-PR diff job — no base/head exists on a push, so skip there.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    # The suite runs ~7-8 min on a normal runner, but GitHub's shared runners
    # vary ~2-2.5x; a slow one was hitting the old 15-min cap at ~78% done and
    # getting killed (a spurious red — the tests were all passing). 25 gives real
    # headroom for the slow tail without masking a genuine hang (pytest-timeout
    # still bounds any single test).
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        side: [base, head]
        seed: [12345, 67890, 99999]

    steps:
      - uses: actions/checkout@v7
        with:
          # `pull_request` checks out the synthetic merge commit by default.
          # We capture the diff script before any branch switch so it
          # survives the base-side checkout below (where scripts/ci/ may
          # not yet exist on the target branch).
          fetch-depth: 1
          persist-credentials: false

      - name: Stash diff script (survives branch switch)
        run: |
          mkdir -p "$HOME/.ci-tools"
          cp scripts/ci/diff-pytest-failures.py "$HOME/.ci-tools/diff-pytest-failures.py"

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: tests/requirements-test.txt

      - name: Install test dependencies
        # pytest-randomly is installed in-workflow only — adding it to
        # tests/requirements-test.txt would silently randomize
        # tests/run-core.sh and any local contributor pytest invocation,
        # because pytest auto-discovers installed plugins.
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements-test.txt 'pytest-randomly>=3.15.0'

      - name: Diff-script self-test
        run: python "$HOME/.ci-tools/diff-pytest-failures.py" --self-test

      - name: Switch to base branch tip (when side=base)
        if: matrix.side == 'base'
        run: |
          git fetch --depth=1 origin "${{ github.base_ref || 'dev' }}"
          git switch --detach FETCH_HEAD

      - name: Run unit suite
        # || true: the existing 34 failures + 17 errors documented in #660
        # produce a non-zero pytest exit. The diff job (`diff` below) is
        # what fails this workflow on regression.
        #
        # --timeout (#2019): without it a single stalled test consumed the whole
        # 25-minute job budget, GitHub cancelled the job, the upload step below
        # was skipped, and the failure read as `The operation was canceled` on
        # whichever PR was running. Four times in one day across all three seeds
        # AND both sides — the base side being plain `dev`, i.e. nothing to do
        # with the PR it reddened.
        #
        # 300s, not the 60s this issue first proposed. Measured from a green
        # run's JUnit rather than guessed: the slowest legitimate unit tests are
        # test_start_agent_skip_inject's two retry cases at ~60.6s (they exercise
        # three real connection retries), then 39.9s and 26.6s in
        # test_1083_result_callback. A 60s cap would have failed those two on
        # every PR. The cap also has to survive the runner variance that caused
        # this issue in the first place — a shard ran 2.5x slower than its
        # siblings — so a 60.6s test can legitimately reach ~150s. 300s clears
        # that with margin and still turns a hang into a named failure: the
        # observed stalls were minutes long and the budget fits ~5 of them.
        #
        # --timeout-method=signal (the default, stated explicitly), NOT thread —
        # also a correction. `thread` dumps stacks and then kills the whole
        # process, so the run aborts, the remaining tests never execute and the
        # JUnit is incomplete: the diff job still fails, just with a named
        # culprit in the log. `signal` raises inside the test, the suite
        # CONTINUES, and the complete JUnit lets the diff job report the hang as
        # an ordinary new failure by name. The logs support that shape — #1952
        # kept making progress after its 3m37s gap, so these are stalls that
        # release, not one permanent hang. `signal` cannot interrupt a C call
        # holding the GIL; if that ever turns out to be the case here, the
        # symptom is another anonymous cancel and `thread` is the fallback.
        run: |
          cd tests
          python -m pytest unit/ -m "not slow" \
            --timeout=300 --timeout-method=signal \
            -p randomly --randomly-seed=${{ matrix.seed }} \
            --junit-xml="$GITHUB_WORKSPACE/junit-${{ matrix.side }}-${{ matrix.seed }}.xml" \
            --tb=no -q || true

      - name: Upload JUnit XML
        # always(): the timeout above should make an abnormal end unreachable,
        # but the diff job is deliberately fail-closed on a missing artifact
        # (correctly — a silent half-comparison is worse). Uploading whatever
        # exists keeps one stalled shard from turning into a second, differently
        # worded failure on the diff job (#2019).
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-${{ matrix.side }}-${{ matrix.seed }}
          path: junit-${{ matrix.side }}-${{ matrix.seed }}.xml
          if-no-files-found: error
          retention-days: 14

  diff:
    name: regression diff
    needs: test
    # Mirror the `test` gate — diff is meaningless without base/head artifacts.
    if: always() && github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Download all JUnit artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: junit-*
          merge-multiple: true

      - name: Diff base vs head
        run: |
          python scripts/ci/diff-pytest-failures.py \
            --base junit-base-12345.xml \
                   junit-base-67890.xml \
                   junit-base-99999.xml \
            --head junit-head-12345.xml \
                   junit-head-67890.xml \
                   junit-head-99999.xml \
            --out "$GITHUB_STEP_SUMMARY"
