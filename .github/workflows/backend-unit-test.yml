name: backend-unit-test

# Per-PR unit-suite regression gate (issue #715), Tier 1 of the tiered merge
# path (#2945).
#
# On a pull request: runs the backend unit suite ONCE on `head` (the PR's merge
# commit, seed 12345) and diffs its failing test IDs against a `base` JUnit.
# The base JUnit is normally the artifact the push-side `absolute` job below
# already produced for the PR's exact base SHA — base is plain `dev`, identical
# for every PR off that SHA, and re-running it per PR was three of the six jobs
# this workflow used to spend (median 21 min, max 42). Only when that artifact
# is missing (the base SHA's push run was superseded mid-burst, or expired) does
# `base-run` fall back to running the base seed inline. The diff fails the
# check if `head` introduces a failing test ID absent from `base`, or if either
# side produced no JUnit XML (fail-closed on infra failure).
#
# Random-order coverage across seeds is Tier 3: `dev-nightly.yml` runs the
# 3-seed matrix on `dev` every night. It is deliberately NOT on the PR — that
# is the explicit quality trade recorded on #2945.
#
# Issue #802: also runs on push to dev/main so baseline-style invariant checks
# (lint-sys-modules) fire post-merge — catches the case where two PRs both
# pass their pre-merge CI but the merge of one invalidates the baseline the
# other landed. The per-PR diff jobs (test, diff) only run on pull_request
# since there's no base/head to compare on a push.
#
# Trigger manually via the Actions tab (workflow_dispatch) for backfill.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: backend-unit-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-sys-modules:
    # Issue #762: prevent NEW bare sys.modules mutations in tests/.
    # Stdlib-only AST check; baseline-ratcheted to permit pre-existing
    # violations without blocking unrelated PRs.
    name: lint (sys.modules pollution check)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Run sys.modules lint
        run: python tests/lint_sys_modules.py
      # Issue #1895: keep self-contained tests OUT of the tests/ root (the per-PR
      # unit job only collects tests/unit/) and keep async unit tests explicitly
      # marked (strict pytest-asyncio). Stdlib-only AST check; same unconditional
      # push+PR home as the sys.modules lint so it can never be path-filtered away.
      - name: Run root-test-placement lint
        run: python tests/lint_root_test_placement.py

  test:
    name: pytest (${{ matrix.side }}, seed ${{ matrix.seed }})
    # Per-PR diff job — no base/head exists on a push, so skip there.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    # The suite runs ~7-8 min on a normal runner, but GitHub's shared runners
    # vary ~2-2.5x; a slow one was hitting the old 15-min cap at ~78% done and
    # getting killed (a spurious red — the tests were all passing). 25 gave real
    # headroom for the slow tail without masking a genuine hang (pytest-timeout
    # still bounds any single test).
    #
    # 2026-08-25: raised 25 -> 45, because the premise above expired. The
    # baseline is no longer 7-8 min. Measured across three consecutive runs of
    # this workflow, same six-shard matrix:
    #
    #     13m  13m  14m  14m  16m  23m   (all SUCCESS)
    #
    # plus repeated `The operation was canceled` at exactly 25m on both sides.
    # So the suite roughly doubled while the cap stood still: 25 was ~3x the
    # baseline when it was chosen and is ~1.8x now, and a 23-minute shard clears
    # it by two minutes. That is not headroom, and the resulting red lands on
    # whichever PR is open — including the `base` side, which is plain `dev` and
    # has nothing to do with the PR it reddens (the #2019 symptom, unchanged).
    #
    # 45 restores the ~3x the original comment was reasoning about. It does NOT
    # weaken hang detection in the way the number suggests: `--timeout=300
    # --timeout-method=signal` below is what turns a stalled TEST into a named
    # failure, and this cap only ever catches what that cannot — a stall the
    # signal handler cannot interrupt (a C call holding the GIL, or a process in
    # uninterruptible I/O). Those were anonymous cancels at 25m and will be
    # anonymous cancels at 45m; the only thing that changes is that a merely
    # slow runner stops producing one.
    #
    # The honest alternative is to make the suite faster (or shard it with
    # xdist) rather than keep buying minutes. That is worth doing and is not
    # this change; raising the cap stops the bleeding without hiding the trend,
    # since the durations above are recorded here for the next reader.
    #
    # 2026-09-01 (#2461): that alternative is now taken — see `-n auto
    # --dist loadfile` on the run step below. The cap STAYS at 45. The point of
    # parallelising is not to use the headroom, it is to move the whole
    # distribution far enough below the cap that a slow runner stops reaching
    # it. Measured over the 18 runs before this change, 78 shards:
    #
    #     success: min 13m  median 15m  p90 17m  max 30m
    #     killed at the cap: 5-6 shards at exactly 45m  (~8% of shards)
    #     -> ~40% of runs carried at least one spurious red (1 - 0.92^6)
    #
    # and the red lands on whichever PR is open, including the `base` side,
    # which is plain `dev` and has nothing to do with the PR it reddens.
    #
    # Measured on this workflow's own runners, first parallel run (33498960688),
    # same six-shard matrix:
    #
    #     8.1m  8.6m  8.7m  9.0m  9.0m  17.5m   (all SUCCESS)
    #
    # Median 15m -> 9.0m, and the one starved shard — the same ~2x runner
    # variance that used to produce the cancels — landed at 17.5m instead of
    # not finishing at all. That is the number that matters: the worst
    # starvation seen historically was >=3x (15m of work not finishing inside
    # 45m), and 3x of 9m is 27m, which clears the cap by 18 minutes.
    #
    # Do NOT raise this number as the next step if the cap starts being reached
    # again. Three raises in a row would mean the suite is growing faster than
    # anyone is willing to measure it; the next lever is the balance of the
    # distribution (`--dist load` instead of `loadfile`, or splitting the
    # slowest files), not the budget.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        side: [head]
        seed: [12345]

    steps:
      - uses: actions/checkout@v7
        with:
          # `pull_request` checks out the synthetic merge commit by default.
          # We capture the diff script before any branch switch so it
          # survives the base-side checkout below (where scripts/ci/ may
          # not yet exist on the target branch).
          fetch-depth: 1
          persist-credentials: false

      - name: Stash diff script (survives branch switch)
        run: |
          mkdir -p "$HOME/.ci-tools"
          cp scripts/ci/diff-pytest-failures.py "$HOME/.ci-tools/diff-pytest-failures.py"

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: tests/requirements-test.txt

      - name: Install test dependencies
        # pytest-randomly is installed in-workflow only — adding it to
        # tests/requirements-test.txt would silently randomize
        # tests/run-core.sh and any local contributor pytest invocation,
        # because pytest auto-discovers installed plugins.
        #
        # pytest-xdist rides along here for a DIFFERENT reason, stated so the
        # next reader does not infer a rule that isn't there: xdist is inert
        # without `-n`, so by requirements-test.txt's own documented test (see
        # the hypothesis note in that file) it would be harmless to put there.
        # It is here because six workflows install that file and only this one
        # runs the suite in parallel — the narrower home is the honest one.
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements-test.txt \
            'pytest-randomly>=3.15.0' 'pytest-xdist>=3.5.0'

      - name: Diff-script self-test
        run: python "$HOME/.ci-tools/diff-pytest-failures.py" --self-test

      - name: Run unit suite
        # || true: pytest exits non-zero while ANY test fails, and the base side has
        # to keep running so there is something to diff against. The diff job
        # (`diff` below) is what fails this workflow on regression.
        #
        # #2247: the "34 failures + 17 errors documented in #660" this comment used
        # to cite is long stale — measured from this workflow's own JUnit artifacts,
        # `dev` fails exactly 8 (the 5 ent#96 + 3 stale strict-xfails) and 0 once
        # those are fixed. `|| true` still belongs here for the reason above, but it
        # is also why a wholly-red suite is invisible on a PR: base and head fail
        # identically, the diff is empty, the check is green. The `absolute` job
        # below asks the other question, on the push side where it can be asked.
        #
        # --timeout (#2019): without it a single stalled test consumed the whole
        # 25-minute job budget, GitHub cancelled the job, the upload step below
        # was skipped, and the failure read as `The operation was canceled` on
        # whichever PR was running. Four times in one day across all three seeds
        # AND both sides — the base side being plain `dev`, i.e. nothing to do
        # with the PR it reddened.
        #
        # 300s, not the 60s this issue first proposed. Measured from a green
        # run's JUnit rather than guessed: the slowest legitimate unit tests are
        # test_start_agent_skip_inject's two retry cases at ~60.6s (they exercise
        # three real connection retries), then 39.9s and 26.6s in
        # test_1083_result_callback. A 60s cap would have failed those two on
        # every PR. The cap also has to survive the runner variance that caused
        # this issue in the first place — a shard ran 2.5x slower than its
        # siblings — so a 60.6s test can legitimately reach ~150s. 300s clears
        # that with margin and still turns a hang into a named failure: the
        # observed stalls were minutes long and the budget fits ~5 of them.
        #
        # --timeout-method=signal (the default, stated explicitly), NOT thread —
        # also a correction. `thread` dumps stacks and then kills the whole
        # process, so the run aborts, the remaining tests never execute and the
        # JUnit is incomplete: the diff job still fails, just with a named
        # culprit in the log. `signal` raises inside the test, the suite
        # CONTINUES, and the complete JUnit lets the diff job report the hang as
        # an ordinary new failure by name. The logs support that shape — #1952
        # kept making progress after its 3m37s gap, so these are stalls that
        # release, not one permanent hang. `signal` cannot interrupt a C call
        # holding the GIL; if that ever turns out to be the case here, the
        # symptom is another anonymous cancel and `thread` is the fallback.
        #
        # -n auto --dist loadfile (#2461): the "make the suite faster" half of
        # the timeout-minutes note above. `auto` is os.cpu_count(), which is 4
        # on ubuntu-latest and follows the runner if that ever changes.
        #
        # `loadfile`, not the default `load`: it keeps every test in a file on
        # one worker. This suite manipulates sys.modules and pins env at module
        # import (tests/unit/conftest.py, and files like
        # test_2186_start_stopped_agent_recreate.py), so within-file ordering is
        # load-bearing in places while ACROSS files the isolation improves —
        # workers are separate processes, and conftest already pins
        # TRINITY_DB_PATH per PID (`trinity-unit-tests-{os.getpid()}.db`), which
        # is what makes per-worker DB state correct without any change here.
        # The cost of `loadfile` is balance: a shard's critical path is its
        # slowest single FILE (~2 min today, test_start_agent_skip_inject's real
        # connection retries), which is far below the cap. If balance ever
        # becomes the binding constraint, `load` is the next lever — but it
        # needs the within-file assumptions audited first, so it is not a
        # drop-in.
        #
        # Verified before landing, full suite, seed 12345, identical selection:
        # serial 15 failed / 13216 passed / 26 skipped, parallel -n 4 the SAME
        # 15 / 13216 / 26. Wall time is not quoted from that run on purpose —
        # it was measured on a loaded workstation alongside a live Docker
        # stack, where per-test time inflated under concurrency in a way a
        # dedicated runner does not reproduce. The numbers that matter are the
        # CI durations recorded in the PR for #2461.
        #
        # Residual, stated rather than discovered later: if an xdist worker
        # dies mid-run, xdist reports the in-flight test as a failure and
        # carries on, so the JUnit stays complete enough for the diff job. A
        # worker lost together with its queue would show up as a burst of
        # "fixed" tests on one side of the diff, which is noisy but visible —
        # not a silent pass.
        run: |
          cd tests
          python -m pytest unit/ -m "not slow" \
            --timeout=300 --timeout-method=signal \
            -n auto --dist loadfile \
            -p randomly --randomly-seed=${{ matrix.seed }} \
            --junit-xml="$GITHUB_WORKSPACE/junit-${{ matrix.side }}-${{ matrix.seed }}.xml" \
            --tb=no -q || true

      - name: Upload JUnit XML
        # always(): the timeout above should make an abnormal end unreachable,
        # but the diff job is deliberately fail-closed on a missing artifact
        # (correctly — a silent half-comparison is worse). Uploading whatever
        # exists keeps one stalled shard from turning into a second, differently
        # worded failure on the diff job (#2019).
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-${{ matrix.side }}-${{ matrix.seed }}
          path: junit-${{ matrix.side }}-${{ matrix.seed }}.xml
          if-no-files-found: error
          retention-days: 14

  baseline:
    name: cached dev baseline
    # #2945: the base side of the diff is the artifact the `absolute` job below
    # uploaded when the PR's base SHA was itself pushed to dev. Keyed on the EXACT
    # base SHA, never "the newest dev run": a baseline from a later dev would carry
    # dev's own newer breakage and the diff would bill it to this PR — the false
    # positive #715 built the base/head split to avoid.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      found: ${{ steps.fetch.outputs.found }}
    steps:
      - name: Fetch cached base JUnit from the base SHA's push run
        id: fetch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          # A red dev run still holds the CORRECT baseline (its failures are dev's,
          # and the diff exists to subtract them). A cancelled run — superseded by
          # the next push in a burst — uploaded nothing, so it is not selected and
          # the fallback runs instead.
          run_id=$(gh api "repos/$REPO/actions/workflows/backend-unit-test.yml/runs?event=push&branch=$BASE_REF&head_sha=$BASE_SHA&per_page=10" \
            --jq '[.workflow_runs[] | select(.conclusion=="success" or .conclusion=="failure")] | .[0].id // empty')
          if [ -z "$run_id" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no completed push run for base ${BASE_SHA:0:8} — running the base seed inline"
            exit 0
          fi
          if ! gh run download "$run_id" --repo "$REPO" -n junit-push -D baseline || [ ! -s baseline/junit-push.xml ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice::push run $run_id has no usable junit-push artifact — running the base seed inline"
            exit 0
          fi
          mv baseline/junit-push.xml junit-base-cached.xml
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "baseline: push run $run_id for ${BASE_SHA:0:8}"

      - name: Upload cached base JUnit
        if: steps.fetch.outputs.found == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: junit-base-cached
          path: junit-base-cached.xml
          if-no-files-found: error
          retention-days: 14

  base-run:
    name: pytest (base, inline fallback)
    # Runs ONLY when no cached baseline exists for the exact base SHA. Same seed,
    # same xdist layout as the head run, so the two JUnits are comparable.
    needs: baseline
    if: github.event_name != 'push' && needs.baseline.outputs.found != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: tests/requirements-test.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements-test.txt \
            'pytest-randomly>=3.15.0' 'pytest-xdist>=3.5.0'

      - name: Switch to base SHA
        # The SHA the lookup missed, not the moving tip of the base branch.
        run: |
          git fetch --depth=1 origin "${{ github.event.pull_request.base.sha }}"
          git switch --detach FETCH_HEAD

      - name: Run unit suite
        # Same flags as the head run above (see its comment block for why each one).
        run: |
          cd tests
          python -m pytest unit/ -m "not slow" \
            --timeout=300 --timeout-method=signal \
            -n auto --dist loadfile \
            -p randomly --randomly-seed=12345 \
            --junit-xml="$GITHUB_WORKSPACE/junit-base-12345.xml" \
            --tb=no -q || true

      - name: Upload JUnit XML
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-base-12345
          path: junit-base-12345.xml
          if-no-files-found: error
          retention-days: 14

  diff:
    name: regression diff
    needs: [test, baseline, base-run]
    # Mirror the `test` gate — diff is meaningless without base/head artifacts.
    if: always() && github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Download all JUnit artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: junit-*
          merge-multiple: true

      - name: Diff base vs head
        # Fail CLOSED on a missing side. `always()` above means this step runs when
        # `test` was cancelled, or when `baseline` and `base-run` both produced
        # nothing; an empty --base list would make every head failure "new", and an
        # empty --head list would make the diff vacuously green.
        run: |
          set -euo pipefail
          ls junit-base-*.xml >/dev/null 2>&1 \
            || { echo "::error::no base JUnit arrived — neither the cached dev baseline nor the inline fallback produced one"; exit 1; }
          ls junit-head-*.xml >/dev/null 2>&1 \
            || { echo "::error::no head JUnit arrived — the head seed did not complete"; exit 1; }
          python scripts/ci/diff-pytest-failures.py \
            --base junit-base-*.xml \
            --head junit-head-*.xml \
            --out "$GITHUB_STEP_SUMMARY"

  absolute:
    name: pytest (push, absolute failures)
    # THE HOLE THIS FILLS (#2247). `test` and `diff` are both
    # `if: github.event_name != 'push'`, because a base/head diff is meaningless
    # without a base and a head. So on a push to dev/main nothing evaluates the
    # suite at all — and on a PR the diff is empty whenever base and head fail the
    # same way. A test can therefore rot into permanent red without a single red
    # check anywhere, which is exactly what test_ent96_timeline_split did for two
    # days before someone happened to run the suite locally.
    #
    # This job asks the absolute question — "is the suite red at all?" — in the one
    # place the relative question cannot be asked.
    #
    # ONE run, not the 3-seed matrix — that is `dev-nightly.yml` (Tier 3). Since
    # #2945 this run is ALSO the cached baseline every PR's regression diff reads
    # (the `baseline` job above), so it runs with the same seed and the same xdist
    # layout as the PR's head seed: a baseline produced under a different ordering
    # would surface order-dependent failures as the PR's own regressions.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Same suite, same runner variance, same reasoning as the matrix job above
    # (2026-08-25: 25 -> 45).
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: tests/requirements-test.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements-test.txt \
            'pytest-randomly>=3.15.0' 'pytest-xdist>=3.5.0'

      - name: Checker self-test
        # Same precedent as the diff script's self-test: prove the gate works
        # before trusting its verdict. A silently-broken checker reports green.
        run: python scripts/ci/check-failure-baseline.py --self-test

      - name: Run unit suite
        # || true so the checker below produces the report; pytest's own exit code
        # is not the gate (a bare non-zero says nothing about WHICH tests failed,
        # and the baseline is the part worth reviewing).
        run: |
          cd tests
          python -m pytest unit/ -m "not slow" \
            --timeout=300 --timeout-method=signal \
            -n auto --dist loadfile \
            -p randomly --randomly-seed=12345 \
            --junit-xml="$GITHUB_WORKSPACE/junit-push.xml" \
            --tb=no -q || true

      - name: Compare against the committed baseline
        # Fail-closed on a missing/empty XML — see the script's docstring (#715).
        run: |
          python scripts/ci/check-failure-baseline.py \
            --xml junit-push.xml \
            --baseline tests/unit_failure_baseline.txt \
            --out "$GITHUB_STEP_SUMMARY"

      - name: Upload JUnit XML
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-push
          path: junit-push.xml
          if-no-files-found: warn
          retention-days: 14
