name: frontend-e2e

# Playwright @smoke layer for the frontend.
#
# TRIGGERS (issue #1526 — the suite used to run ONLY on `ui`-labeled PRs, so it
# rotted silently and sat red on `dev` for weeks):
#   1. Nightly schedule on `dev`     — the always-visible signal; a red night
#      opens/updates a tracking issue (see the `report` job), à la #1185.
#   2. Any PR that touches `src/frontend/**` — runs automatically (the `changes`
#      job computes this), so frontend authors see their own breakage.
#   3. The `ui` label — still works as a manual opt-in on NON-frontend PRs (and
#      to force a run), preserved for the heavier @visual/@interactive tiers (#596).
#   4. workflow_dispatch — manual/on-demand.
#
# DECISION (AC of #1526): this is **advisory**, not a required merge gate. The
# recurring failure class is modal/overlay flake on a fresh zero-user-agent stack
# (onboarding wizard, ensure-default MCP-key modal), so promoting it to a hard gate
# like #715's unit gate needs a flake budget first (#596). Nightly-on-dev + auto-run
# on frontend PRs gives the visible signal without blocking merges on a suite that
# isn't flake-hardened yet. Revisit gating after #596 lands the baseline story.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: '0 7 * * *'   # 07:00 UTC — nightly on dev
  workflow_dispatch:

# No top-level permissions — each job declares its own narrow scope.
permissions: {}

concurrency:
  # One run per PR (cancel superseded pushes); scheduled/dispatch runs keyed by ref
  # so a nightly never cancels a PR run and vice versa.
  group: frontend-e2e-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---------------------------------------------------------------------------
  # changes — PR-only: does this PR touch the frontend? Dependency-free (gh diff),
  # so a frontend PR runs e2e automatically without the `ui` label.
  # ---------------------------------------------------------------------------
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # `gh pr diff` calls the diff API, which HARD-FAILS with HTTP 406 on PRs
          # over 300 files (#1782): every release PR (500+ files) turned this gate
          # red AND skipped the e2e suite instead of running it. The files API
          # paginates (to a 3000-file ceiling), so use that.
          #
          # FAIL OPEN: if the changed-file list cannot be determined, or cannot be
          # proven COMPLETE, run the suite. This job decides whether e2e runs, so
          # being unable to decide must never mean "don't run" — and must never
          # mean a red X. Completeness is proven by comparing the list length to
          # the PR's own `changed_files`. That comparison is exact: it catches a
          # truncation at the 3000 ceiling AND a pagination that died mid-way but
          # still exited 0 (which a `>= 3000` heuristic silently misses).
          #
          # NOTE: container-security.yml detects changed files with `git diff`
          # instead. That job already checks out the repo to build images; this
          # one must not (a full clone turns a ~5s gate into ~40s), so the two
          # implementations differ ON PURPOSE. Don't "unify" them.
          fail_open() {
            echo "::warning::frontend-e2e change detection failed open ($1) — running e2e"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            exit 0
          }
          err=$(mktemp)
          if ! expected=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.changed_files' 2>"$err"); then
            fail_open "PR lookup failed: $(tr '\n' ' ' < "$err" | cut -c1-300)"
          fi
          if ! files=$(gh api "repos/$REPO/pulls/$PR_NUMBER/files?per_page=100" \
                         --paginate --jq '.[].filename' 2>"$err"); then
            fail_open "file list failed: $(tr '\n' ' ' < "$err" | cut -c1-300)"
          fi
          count=$(printf '%s\n' "$files" | grep -c . || true)
          if [ "$count" != "$expected" ]; then
            fail_open "incomplete list: got $count of $expected files"
          fi
          echo "changed files: $count"
          if printf '%s\n' "$files" | grep -qE '^src/frontend/'; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
          fi

  e2e:
    needs: changes
    # Run when: nightly / manual dispatch, OR the PR touched the frontend, OR the
    # PR carries the `ui` label (manual opt-in, e.g. a non-frontend PR). `always()`
    # so a skipped `changes` job (schedule/dispatch) doesn't gate this out.
    # Defence in depth (#1782): a `changes` job that failed or was cancelled left
    # no verdict, and "unable to determine" must mean RUN, never silently skip.
    # The step itself already fails open, so these clauses guard a future cause
    # (runner crash, a later edit reintroducing a hard exit), not today's bug.
    if: >-
      always() &&
      ( github.event_name == 'schedule'
        || github.event_name == 'workflow_dispatch'
        || needs.changes.outputs.frontend == 'true'
        || needs.changes.result == 'failure'
        || needs.changes.result == 'cancelled'
        || contains(github.event.pull_request.labels.*.name, 'ui') )
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    defaults:
      run:
        working-directory: src/frontend

    steps:
      - uses: actions/checkout@v7
        with:
          # PR events check out the merge ref (default); scheduled/dispatch runs
          # target `dev` explicitly (github.ref would otherwise be the default branch).
          ref: ${{ github.event_name == 'pull_request' && github.ref || 'dev' }}

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('src/frontend/package-lock.json') }}

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Generate CI admin password
        # I-01 fix (cso-diff-2026-05-17): replace the previous hardcoded
        # `CiTestPassword!1` fallback with a per-run random value so the
        # repo never publishes a default admin credential, even one only
        # reachable from the runner sandbox. Honours an explicit
        # E2E_ADMIN_PASSWORD secret override when set. The literal `Aa1!`
        # suffix guarantees OWASP ASVS 2.1 complexity classes on the
        # random branch (upper / lower / digit / special) — `tr -d`
        # strips base64 chars that would break form-encoded curl bodies
        # later.
        env:
          OVERRIDE: ${{ secrets.E2E_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${OVERRIDE:-}" ]; then
            PASS="$OVERRIDE"
          else
            PASS="$(openssl rand -base64 24 | tr -d '/+=\n')Aa1!"
          fi
          echo "::add-mask::$PASS"
          echo "ADMIN_PASSWORD=$PASS" >> "$GITHUB_ENV"

      - name: Start Trinity stack
        working-directory: ${{ github.workspace }}
        env:
          # ADMIN_PASSWORD is inherited from GITHUB_ENV (see the
          # "Generate CI admin password" step above).
          ANTHROPIC_API_KEY: ${{ secrets.E2E_ANTHROPIC_API_KEY || 'placeholder' }}
        run: |
          # Generate the minimum .env needed to boot. Real secrets are not
          # required for e2e — login uses ADMIN_PASSWORD only.
          cp .env.example .env
          echo "ADMIN_PASSWORD=$ADMIN_PASSWORD" >> .env
          echo "ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY" >> .env
          echo "SECRET_KEY=$(openssl rand -hex 32)" >> .env
          # Keep the e2e baseline at zero user agents (learnings 2026-07-08):
          # the sentinel disables the ent#124 starter-fleet seeder explicitly.
          # NOTE it does NOT gate the Cornelius seeder (ent#107, no disable
          # knob) — Cornelius stays un-seeded here only by timing: the lifespan
          # gate reads setup_completed=false at boot and the docker-exec flip
          # below never re-triggers it. If this workflow ever completes setup
          # via the real endpoint, Cornelius will seed and break the baseline.
          echo "TRINITY_DEFAULT_SYSTEM_MANIFEST=disabled" >> .env
          ./scripts/deploy/start.sh

      - name: Wait for backend health
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:8000/health >/dev/null 2>&1; then
              echo "backend healthy"; exit 0
            fi
            sleep 2
          done
          echo "backend never became healthy"; exit 1

      # Issue #874 regression guards (`verify-non-root`,
      # `verify-prod-frontend-uid`) live in .github/workflows/container-security.yml
      # so they run unconditionally on infrastructure PRs (this workflow's e2e job
      # is conditionally triggered and would otherwise skip them on backend PRs).

      - name: Skip first-time setup wizard
        working-directory: ${{ github.workspace }}
        run: |
          # On a fresh DB the admin user is bootstrapped from ADMIN_PASSWORD,
          # but `setup_completed` stays false (the backfill migration runs
          # before admin creation). Without this flag the frontend redirects
          # every route to /setup. Mark setup complete directly.
          docker exec trinity-backend python3 -c "from database import db; db.set_setting('setup_completed', 'true'); print('setup_completed=true')"

      - name: Run Playwright smoke tests
        env:
          # ADMIN_PASSWORD is inherited from GITHUB_ENV (see the "Generate
          # CI admin password" step).
          E2E_BASE_URL: http://localhost
        # Only @smoke-tagged specs run in CI. @visual / @interactive specs
        # are local-only until their flake/baseline story is sorted (#596).
        run: npm run test:e2e:smoke

      - name: Collect Trinity logs on failure
        if: failure()
        working-directory: ${{ github.workspace }}
        run: |
          docker compose logs --no-color --tail=200 backend frontend mcp-server > trinity-logs.txt || true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: src/frontend/e2e/playwright-report/
          retention-days: 14

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-failure-artifacts
          path: |
            src/frontend/e2e/test-results/
            trinity-logs.txt
          retention-days: 14

  # ---------------------------------------------------------------------------
  # report — nightly-only durable signal (#1526 AC). On a red nightly, open or
  # update a single tracking issue linking the failing run; on a green nightly,
  # close it. PR runs already surface a failing check, so this is schedule-only.
  # ---------------------------------------------------------------------------
  report:
    needs: e2e
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v9
        env:
          E2E_RESULT: ${{ needs.e2e.result }}
        with:
          script: |
            const marker = '<!-- frontend-e2e-nightly-tracker -->';
            const failed = process.env.E2E_RESULT === 'failure';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            // Find the single open tracking issue by marker (label-scoped).
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'frontend-e2e-nightly',
              per_page: 100,
            });
            const tracker = open.find(i => (i.body || '').includes(marker));

            if (failed) {
              const body = `${marker}\n**The \`frontend-e2e\` nightly @smoke suite is red on \`dev\`.**\n\n` +
                `Latest failing run: ${runUrl}\n\n` +
                `This is the visible signal from #1526 — a spec is drifting against \`dev\`. Reproduce locally with ` +
                `\`cd src/frontend && npm run test:e2e:smoke\` (see \`.github/workflows/frontend-e2e.yml\`). ` +
                `If it's modal/overlay flake on the fresh stack, pre-seed dismissal state in \`e2e/auth.setup.js\` (#1508 pattern).`;
              if (tracker) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: tracker.number,
                  body: `🔴 Still red as of ${new Date().toISOString().slice(0, 10)} — ${runUrl}`,
                });
                core.info(`Updated tracking issue #${tracker.number}.`);
              } else {
                const created = await github.rest.issues.create({
                  owner: context.repo.owner, repo: context.repo.repo,
                  title: 'frontend-e2e nightly @smoke suite is red on dev',
                  body,
                  labels: ['frontend-e2e-nightly', 'type-bug', 'theme-devex', 'priority-p2'],
                });
                core.info(`Opened tracking issue #${created.data.number}.`);
              }
            } else if (tracker) {
              // Green nightly — close the tracker so it doesn't rot.
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: tracker.number,
                body: `🟢 Nightly @smoke suite green on \`dev\` as of ${new Date().toISOString().slice(0, 10)} — closing. ${runUrl}`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: tracker.number, state: 'closed',
              });
              core.info(`Closed tracking issue #${tracker.number} (nightly green).`);
            } else {
              core.info('Nightly green and no open tracker — nothing to do.');
            }
