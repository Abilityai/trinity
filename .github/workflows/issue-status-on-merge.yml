name: Issue Status on PR Merge

# `pull_request_target`, not `pull_request` (#2767).
#
# On `pull_request` a PR opened from a FORK gets a READ-ONLY `GITHUB_TOKEN`, so
# every label write was refused with "Resource not accessible by integration"
# and the issue stranded in `status-in-progress` after its fix had already
# landed. That only ever bit external contributors — the PRs nobody is watching
# the label on. `pull_request_target` runs in the context of the BASE repo and
# so carries the write token the `permissions:` block below asks for.
#
# WHY THAT IS SAFE HERE, AND WHAT WOULD MAKE IT UNSAFE
#
# `pull_request_target` is the standard privilege-escalation footgun: it hands a
# write token to a workflow triggered by a stranger's PR. The escalation always
# takes the same form — the workflow CHECKS OUT the PR's head and then EXECUTES
# something from it (a build, a test, a script, an action pinned by a path in
# the PR). This workflow does neither, and both absences are load-bearing:
#
#   * there is NO `actions/checkout` — no PR code is ever fetched;
#   * there are NO `run:` steps — nothing from the PR is ever executed;
#   * the only untrusted values read are `pull_request.title` and `.body`, and
#     they reach exactly one regex that extracts `\d+`. Nothing is interpolated
#     into a shell, and nothing is `eval`'d.
#
# Note also that `pull_request_target` runs the workflow file as it exists on
# the BASE branch, never the PR's copy — so a fork cannot edit this file to make
# it do something else. That is a property of the trigger, not of this file, and
# it is why the three bullets above are sufficient rather than merely current.
#
# The residual capability is therefore bounded to what the feature does anyway:
# a merged PR can name which issue numbers get relabelled. That requires a
# maintainer to MERGE the PR first (`if: merged == true`), affects labels only,
# and is recorded in the issue's own timeline.
#
# If you add a checkout, a `run:` step, or any use of the PR's text beyond the
# number regex, this trigger stops being safe — go back to `pull_request` and
# use a repo-scoped PAT for the label calls instead. `tests/unit/
# test_2767_issue_status_fork_prs.py` fails the build if that happens.
on:
  pull_request_target:
    types: [closed]
    branches: [dev]

permissions:
  issues: write
  pull-requests: read

jobs:
  mark-in-dev:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Mark referenced issues as status-in-dev
        uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request;
            const haystack = `${pr.title || ''}\n${pr.body || ''}`;

            // Match Fixes/Fixed/Closes/Closed/Resolves/Resolved #N (case-insensitive)
            const pattern = /\b(?:fix(?:e[sd])?|close[sd]?|resolve[sd]?)\s+#(\d+)/gi;
            const issues = [...new Set([...haystack.matchAll(pattern)].map(m => parseInt(m[1], 10)))];

            if (issues.length === 0) {
              core.info('No Fixes/Closes/Resolves references found in PR — nothing to do.');
              return;
            }

            core.info(`Promoting ${issues.length} issue(s) to status-in-dev: ${issues.join(', ')}`);

            // #2767: collected, not thrown at the first miss. Every issue is
            // still attempted — one unlabelable issue must not strand the
            // others — and the run goes RED at the end. A refused write used
            // to be a `core.warning` on a SUCCESSFUL run, which is how this
            // stayed invisible: the job was green while the issue sat in
            // `status-in-progress` with its fix already on dev.
            const failures = [];

            for (const num of issues) {
              try {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: num,
                  labels: ['status-in-dev']
                });
                core.info(`#${num}: added status-in-dev`);
              } catch (e) {
                failures.push(`#${num}: could not add status-in-dev — ${e.message}`);
                continue;
              }

              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: num,
                  name: 'status-in-progress'
                });
                core.info(`#${num}: removed status-in-progress`);
              } catch (e) {
                // A 404 means the label was not on the issue — the normal case
                // for an issue that was never picked up, and not a failure.
                if (e.status === 404) {
                  core.info(`#${num}: status-in-progress was not present`);
                } else {
                  failures.push(`#${num}: could not remove status-in-progress — ${e.message}`);
                }
              }
            }

            if (failures.length > 0) {
              core.setFailed(
                `${failures.length} issue label write(s) were refused — the issues below are ` +
                `still mislabelled and need a manual fix:\n` + failures.join('\n')
              );
            }
