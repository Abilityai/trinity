name: Sync Docs to Vertex AI Search

on:
  push:
    branches: [main]
    paths:
      - 'docs/onboarding/**'
      - 'docs/user-docs/**'
      - 'docs/TRINITY_COMPATIBLE_AGENT_GUIDE.md'
      - '.github/workflows/sync-docs-to-vertex.yml'
  # The docs-site catalogue (llms.txt) changes when the docs site deploys, which
  # is not a push here — re-sync daily so it never goes stale (ent#1285).
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

concurrency:
  group: sync-docs-to-vertex
  cancel-in-progress: false

env:
  PROJECT_ID: mcp-server-project-455215
  BUCKET: gs://trinity-docs-rag-mcp-server-project-455215
  DATA_STORE_ID: trinity-docs
  LOCATION: global

jobs:
  sync-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        # SHA-pinned to mitigate supply-chain hijack of the v2 floating tag.
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        # SHA-pinned to mitigate supply-chain hijack of the v2 floating tag.
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Convert and sync docs to GCS
        run: |
          set -euo pipefail
          # Convert .md to .txt with text/plain content type (Vertex AI Search requirement)
          mkdir -p /tmp/docs-txt

          # Docs-site catalogue (ent#1285): every docs.ability.ai page URL and
          # YouTube video URL with a one-line description, generated by the
          # site from its own data. Without it the bot knows the content but
          # can only cite repo paths. A failed or malformed download FAILS the
          # step — `rsync -d` + `reconciliationMode: FULL` would otherwise
          # silently delete the catalogue from the index.
          curl -fsSL --retry 3 --retry-all-errors --max-time 60 \
            https://docs.ability.ai/llms.txt -o /tmp/llms.txt
          links=$(grep -c 'https://docs\.ability\.ai/' /tmp/llms.txt || true)
          videos=$(grep -cE 'https://(youtu\.be|(www\.)?youtube\.com)/' /tmp/llms.txt || true)
          if [ "$links" -lt 50 ] || [ "$videos" -lt 10 ]; then
            echo "::error::llms.txt looks wrong (${links} docs links, ${videos} video links) — refusing to sync"
            exit 1
          fi
          # Split per `## ` section so each section is its own document: one
          # 50 KB file buries a single page/video entry in a large chunk.
          # Each part carries the site header so a retrieved chunk says what
          # the links are. Section names are stable, so file names are too.
          LLMS_HEADER=$(awk '/^## /{exit} {print}' /tmp/llms.txt) \
          awk -v dir=/tmp/docs-txt '
            /^## / {
              if (out) close(out)
              slug = tolower(substr($0, 4)); gsub(/[^a-z0-9]+/, "-", slug); gsub(/^-|-$/, "", slug)
              out = dir "/docs-site-catalogue-" slug ".txt"
              print ENVIRON["LLMS_HEADER"] "\n" > out
            }
            out { print > out }
          ' /tmp/llms.txt
          parts=$(ls /tmp/docs-txt/docs-site-catalogue-*.txt | wc -l)
          [ "$parts" -ge 5 ] || { echo "::error::llms.txt split into only ${parts} sections"; exit 1; }
          echo "Docs-site catalogue: ${links} page links, ${videos} video links, ${parts} sections"

          # Sync docs/onboarding (flat)
          for file in docs/onboarding/*.md; do
            [ -f "$file" ] || continue
            basename=$(basename "$file" .md)
            cp "$file" "/tmp/docs-txt/${basename}.txt"
          done

          # Agent guide — the get_agent_requirements source and a frequent
          # evaluator question target (#1459)
          cp docs/TRINITY_COMPATIBLE_AGENT_GUIDE.md /tmp/docs-txt/TRINITY_COMPATIBLE_AGENT_GUIDE.txt

          # Sync docs/user-docs (recursive, preserve relative paths with hyphens)
          find docs/user-docs -name "*.md" -type f | while read file; do
            # Convert path like docs/user-docs/guides/building-agents.md to user-docs-guides-building-agents.txt
            relpath="${file#docs/user-docs/}"
            txtname=$(echo "$relpath" | sed 's|/|-|g' | sed 's|\.md$|.txt|')
            cp "$file" "/tmp/docs-txt/${txtname}"
          done

          # Sync to GCS with explicit content type
          gsutil -m -h "Content-Type:text/plain" rsync -r -d /tmp/docs-txt/ ${{ env.BUCKET }}/txt/
          echo "Synced $(gsutil ls ${{ env.BUCKET }}/txt/ | wc -l) files"

      - name: Trigger document re-import
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer $(gcloud auth print-access-token)" \
            -H "Content-Type: application/json" \
            -H "X-Goog-User-Project: ${{ env.PROJECT_ID }}" \
            "https://discoveryengine.googleapis.com/v1/projects/${{ env.PROJECT_ID }}/locations/${{ env.LOCATION }}/collections/default_collection/dataStores/${{ env.DATA_STORE_ID }}/branches/default_branch/documents:import" \
            -d '{
              "gcsSource": {
                "inputUris": ["${{ env.BUCKET }}/txt/*"],
                "dataSchema": "content"
              },
              "reconciliationMode": "FULL"
            }'
          echo "Document re-import triggered"
