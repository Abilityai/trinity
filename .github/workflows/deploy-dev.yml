name: Deploy to Dev

on:
  push:
    branches: [dev]

# CSO L5: least-privilege token — deploy runs over SSH/Tailscale secrets, not GITHUB_TOKEN.
permissions:
  contents: read

# #2204: serialise deploys. Measured up to FOUR runs executing concurrently
# against the one dev VM (2026-08-12T12:49:51-12:50:15, overlapping 960-1215s),
# each running `docker compose build --no-cache` then `up -d` on the same host
# and compose project: concurrent recreates of the same container, and four
# concurrent full image builds on one box.
#
# cancel-in-progress MUST stay false. Cancelling mid-run is precisely what
# strands a half-recreated container -- compose renames the outgoing container
# to a <12-hex>_<name> backup and removes it once the replacement is up, so a
# run killed in between leaves the backup resident (see the reaper below).
# GitHub supersedes the *pending* run rather than the running one, so this
# converges on "current deploy finishes, then the newest commit deploys"
# without ever interrupting a deploy in flight.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Connect to Tailscale
        # SHA-pinned to mitigate supply-chain hijack of the v2 floating tag.
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}

      - name: Deploy
        # SHA-pinned to mitigate supply-chain hijack of the v1 floating tag.
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          # Host + username come from repo secrets so this public workflow file
          # doesn't disclose the Tailscale topology of the dev environment.
          host: ${{ secrets.DEV_HOST }}
          username: ${{ secrets.DEV_USER }}
          key: ${{ secrets.DEV_SSH_KEY }}
          command_timeout: 25m
          script: |
            set -e
            cd ~/trinity

            echo "=== Pull ==="
            git fetch origin dev
            git checkout dev
            # The dev VM has a persistent checkout that may carry hand-applied
            # fixes (e.g. docker-compose.prod.yml tweaks). `git pull` aborts on
            # dirty tree, blocking every deploy. Stash with a deploy-run-keyed
            # message so the changes are recoverable via `git stash list` (and
            # survive in the reflog for ~90 days) without polluting history.
            # If the working tree is clean, stash is a no-op (exit 0).
            #
            # Long-term fix is to move the build to CI + push images to a
            # registry so the dev VM is stateless (see #942). Until then, this
            # keeps deploys unblocked while preserving the audit trail.
            # Workflow-syntax interpolation: GitHub expands `${{ github.run_id }}`
            # at YAML render time so the literal run id is baked into the script
            # before it ships over SSH. Using `$GITHUB_RUN_ID` here would fail
            # silently — that env var lives on the GH Actions runner, not on
            # the dev VM where this script actually executes.
            #
            # NO `-u`: the dev VM has Docker-volume directories (trinity-data/,
            # archives/, avatars/) owned by root inside containers. The trinity
            # user can't `rm` those, so `git stash -u` aborts mid-cleanup with
            # "Permission denied", leaves the stash entry created but the
            # working tree UNREVERTED, returns non-zero, our `|| echo` masks
            # the failure as "no changes" — and the subsequent pull aborts on
            # the still-dirty tracked file. Tracked-only stash is what actually
            # blocks the pull; untracked Docker-owned files don't block git.
            STASH_MSG="auto-stash-deploy-${{ github.run_id }}"
            git stash push -m "${STASH_MSG}" || echo "No local changes to stash"
            git pull --ff-only origin dev
            echo "Version: $(git log -1 --oneline)"

            echo "=== Submodule (enterprise) ==="
            # #847 — try to init the private trinity-enterprise submodule
            # so the dev deploy lights up enterprise features (audit
            # dashboard, etc.). If the VM lacks read access to the private
            # repo, this is a non-fatal warning — the conditional import
            # in main.py falls back to OSS-only mode and the deploy
            # continues. Enterprise UI surfaces simply stay hidden.
            #
            # #1443 — .gitmodules now sets `update = none` on this
            # submodule (OSS clones skip it). A skipped submodule exits 0,
            # so (a) persist a local `update = checkout` override so this
            # and every future plain `git submodule update` on the VM
            # actually syncs it, and (b) judge success by the populated
            # marker file, never the exit code.
            git config submodule.src/backend/enterprise.update checkout

            # #2246 — transport, not just authorization. `.gitmodules` uses SSH
            # for this submodule (and HTTPS for `.claude`), so this is the only
            # one that can die at `Host key verification failed` — which is
            # exactly what it had been doing on every retained run since
            # 2026-07-29, one layer BEFORE any credential was offered.
            #
            # When ENT_SUBMODULE_PAT is configured, rewrite the SSH URL to HTTPS for
            # the duration of this one command. `-c` exports GIT_CONFIG_PARAMETERS,
            # which child processes inherit — so the submodule's own clone picks it
            # up while the token NEVER lands in .git/config on the VM disk. That
            # clears the host-key layer and the authorization layer together, which
            # a known_hosts entry alone does not (docs/ENTERPRISE.md).
            #
            # Absent the secret this is byte-identical to the previous behaviour,
            # so the VM-side fix documented in docs/ENTERPRISE.md remains valid.
            ENT_PAT="${{ secrets.ENT_SUBMODULE_PAT }}"
            ENT_LOG=$(mktemp)
            if [ -n "$ENT_PAT" ]; then
              echo "ENTERPRISE: using HTTPS transport (ENT_SUBMODULE_PAT configured)"
              git -c "url.https://x-access-token:${ENT_PAT}@github.com/.insteadOf=git@github.com:" \
                  -c "url.https://x-access-token:${ENT_PAT}@github.com/.insteadOf=https://github.com/" \
                  submodule update --init --recursive src/backend/enterprise >"$ENT_LOG" 2>&1 || true
            else
              git submodule update --init --recursive src/backend/enterprise >"$ENT_LOG" 2>&1 || true
            fi
            # Echo what happened either way — the previous version discarded the
            # clone's own output, which is why the cause had to be reconstructed
            # from a single unexpired run's logs.
            sed 's/^/ENTERPRISE| /' "$ENT_LOG" || true

            if [ -f src/backend/enterprise/backend/__init__.py ]; then
              ENT_SHA=$(git -C src/backend/enterprise rev-parse --short HEAD 2>/dev/null || echo "unknown")
              echo "ENTERPRISE: initialized at ${ENT_SHA}"
              # A populated marker only proves the tree exists — a failed
              # update on a previously-mounted VM leaves the OLD checkout in
              # place. Compare against the recorded gitlink and warn on
              # drift so a stale enterprise tree can't ship under a green
              # log line (#1443 review F2).
              WANT=$(git rev-parse HEAD:src/backend/enterprise 2>/dev/null || echo "none")
              HAVE=$(git -C src/backend/enterprise rev-parse HEAD 2>/dev/null || echo "none")
              if [ "$WANT" != "$HAVE" ]; then
                echo "::warning::Enterprise submodule STALE: checked out ${HAVE}, dev records ${WANT} — update failed; deploying the old enterprise tree"
              fi
            else
              echo "::warning::Enterprise submodule init failed — deploying in OSS-only mode"
              # #2246 — classify the cause instead of asserting one. The previous
              # two lines named an AUTHORIZATION remedy unconditionally, while the
              # clone was actually failing host-key verification; following that
              # hint installs a deploy key and changes nothing. The classifier
              # prints the remedy that matches the observed output, and says
              # "unknown" rather than guessing.
              bash scripts/ci/classify-submodule-failure.sh "$ENT_LOG" \
                | sed 's/^/ENTERPRISE: /' || true
            fi
            rm -f "$ENT_LOG"

            # Compose file list: base prod + enterprise overlay. The
            # overlay bind-mounts ./src/backend/enterprise into
            # /app/enterprise inside the backend container. If the
            # submodule init above failed, the host directory will be
            # empty (or contain just .git), and the conditional import
            # in main.py will fall through to OSS-only mode — same
            # outcome as if the overlay weren't applied.
            COMPOSE_FILES="-f docker-compose.prod.yml -f docker-compose.prod.enterprise.yml"

            echo "=== Volume ownership (#874 / #958) ==="
            # Backend + scheduler run as UID 1000 (issue #874). Existing
            # deployments rolled before #874 still have data paths owned by
            # root from the prior root-container era. The first migration to
            # actually UPDATE existing rows (#922's null_legacy_schedule_
            # timeouts) hits "attempt to write a readonly database" on
            # startup, /health returns 503 forever, deploy times out.
            # Canonical recipe: docs/migrations/NON_ROOT_CONTAINERS_2026-05.md.
            # Both checks are idempotent — silent no-ops on healthy VMs.
            TRINITY_DATA_PATH="${TRINITY_DATA_PATH:-./trinity-data}"
            if [ -d "$TRINITY_DATA_PATH" ]; then
              DATA_UID=$(stat -c %u "$TRINITY_DATA_PATH")
              if [ "$DATA_UID" != "1000" ]; then
                echo "Re-owning $TRINITY_DATA_PATH from UID=$DATA_UID to UID=1000"
                sudo chown -R 1000:1000 "$TRINITY_DATA_PATH"
              fi
            fi
            # agent-configs is a named volume; check + chown via ephemeral
            # alpine container running as root.
            PROJECT=$(basename "$PWD")
            VOL_NAME="${PROJECT}_agent-configs"
            if sudo docker volume inspect "$VOL_NAME" >/dev/null 2>&1; then
              VOL_UID=$(sudo docker run --rm -v "$VOL_NAME:/v" alpine stat -c %u /v 2>/dev/null || echo "0")
              if [ "$VOL_UID" != "1000" ]; then
                echo "Re-owning volume $VOL_NAME from UID=$VOL_UID to UID=1000"
                sudo docker run --rm -v "$VOL_NAME:/v" --user 0 alpine chown -R 1000:1000 /v
              fi
            fi

            echo "=== Build ==="
            # Build-time provenance (#926 / #958 / #993). docker-compose.prod.yml
            # backend.build.args reads these env vars; absent them, the
            # Dockerfile defaults to "unknown" and Build Info in the UI
            # shows a wall of unknown values. Mirrors scripts/deploy/start.sh.
            #
            # #993: pass via `sudo env VAR=val …` — NOT `sudo VAR=val …`.
            # Under default Ubuntu sudoers (env_reset on, setenv off), env
            # assignments placed before the command are filtered out, so the
            # prior form silently dropped every var and compose fell back to
            # ${VAR:-unknown}. `env` is the program sudo execs, so the
            # assignments are its arguments and reach docker compose intact.
            GIT_COMMIT=$(git rev-parse HEAD)
            GIT_COMMIT_SUBJECT=$(git log -1 --pretty=%s)
            GIT_COMMIT_TIMESTAMP=$(git log -1 --pretty=%cI)
            GIT_BRANCH=$(git rev-parse --abbrev-ref HEAD)
            BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            # #993: dynamic version = VERSION file + git short sha (+ .dirty).
            BASE_VER=$(cat VERSION 2>/dev/null || echo unknown)
            SHORT_SHA=$(git rev-parse --short=8 HEAD)
            git diff --quiet HEAD 2>/dev/null || SHORT_SHA="${SHORT_SHA}.dirty"
            VERSION="${BASE_VER}+g${SHORT_SHA}"
            sudo env \
              VERSION="${VERSION}" \
              GIT_COMMIT="${GIT_COMMIT}" \
              GIT_COMMIT_SUBJECT="${GIT_COMMIT_SUBJECT}" \
              GIT_COMMIT_TIMESTAMP="${GIT_COMMIT_TIMESTAMP}" \
              GIT_BRANCH="${GIT_BRANCH}" \
              BUILD_DATE="${BUILD_DATE}" \
              docker compose ${COMPOSE_FILES} build --no-cache backend frontend mcp-server scheduler

            echo "=== Reap stale compose backup containers (#2204) ==="
            # Compose renames the outgoing container to <12-hex>_<name> before
            # starting its replacement, then removes the backup once the new one
            # is up. A run that dies in between leaves the backup resident, and
            # every later deploy hits "container name is already in use" at the
            # identical point.
            #
            # HONEST SCOPE: this is hygiene, NOT the fix for the #2204 outage.
            # That outage was a corrupted database crash-looping the backend;
            # host inspection found no orphan at all, and clearing one would
            # only have moved the failure to the health check below. Do not
            # record this block as the fix for that incident.
            #
            # Both guards are load-bearing under the `set -e` at the top of this
            # script: `grep` exits 1 when nothing matches, and `docker rm -f`
            # exits 1 when given no arguments. Unguarded, either would abort
            # EVERY healthy deploy -- the no-orphan path is the common one.
            STALE=$(sudo docker ps -a --format '{{.Names}}' | grep -E '^[0-9a-f]{12}_trinity-' || true)
            if [ -n "$STALE" ]; then
              echo "Reaping stale compose backup containers:"
              printf '%s\n' "$STALE"
              printf '%s\n' "$STALE" | xargs -r sudo docker rm -f
            else
              echo "No stale compose backup containers."
            fi

            echo "=== Restart ==="
            sudo docker compose ${COMPOSE_FILES} up -d backend frontend mcp-server scheduler

            echo "=== Health ==="
            sleep 10
            curl -sf http://localhost:8000/health && echo "Backend: OK"
            SCHED=$(sudo docker inspect trinity-scheduler --format='{{.State.Health.Status}}')
            echo "Scheduler: $SCHED"
            [ "$SCHED" = "healthy" ] || echo "WARNING: scheduler not healthy yet"

            echo "=== Backend boot log ==="
            # ONE read, several consumers (enterprise registration below, and
            # the #2204 seeding check). Scope it to the CURRENT container run,
            # so a line left over from a previous boot cannot fail today's
            # deploy.
            #
            # The --tail fallback does NOT carry that property, and is sound
            # only here: `up -d` just recreated this container, so its whole log
            # is a few hundred lines and every boot line is inside the window.
            # On a long-running container it would be wrong in both directions
            # -- deep enough to catch a previous boot's failure line, and too
            # shallow to reach the current boot's success line (a live instance
            # measured 14k lines since start). Don't lift this block somewhere
            # the container isn't newly started.
            BOOT_SINCE=$(sudo docker inspect -f '{{.State.StartedAt}}' trinity-backend 2>/dev/null || echo "")
            if [ -n "$BOOT_SINCE" ]; then
              BOOT_LOG=$(sudo docker logs trinity-backend --since "$BOOT_SINCE" 2>&1 || true)
            else
              BOOT_LOG=$(sudo docker logs trinity-backend --tail 2000 2>&1 || true)
            fi

            echo "=== Enterprise registration (#2068) ==="
            # The enterprise version-line is upgraded during module
            # registration, which runs at IMPORT time — before uvicorn serves.
            # So if /health answered above, the outcome line is already in the
            # log: no polling, no race.
            #
            # Why a log grep and not `GET /api/version` → edition: that endpoint
            # requires authentication (SEC-180), so asserting on it would drag an
            # admin token into the deploy path. main.py's own comment beside the
            # success string says "docker logs captures it and CI greps for this
            # exact string" — this uses an interface that already declares itself
            # a CI-grep target, and build-without-submodule.yml already
            # establishes boot-log grepping as the accepted assertion here.
            #
            # This is the layer that catches #2068: a multi-head version-line
            # makes registration raise, the seam's broad `except` degrades the
            # instance to OSS-only, and every other signal stays green —
            # containers up, /health healthy, gated routes answering 403. The
            # existing error check below would have PRINTED this and moved on,
            # because it ends in `|| echo "No errors"`.
            #
            # Guarded on the populated marker file — which is precisely the blind
            # spot #2246 found. These assertions catch "mounted but not
            # registered"; they structurally CANNOT fire on "not mounted at all",
            # which is the state the dev VM was actually in for weeks. The loud
            # check guarded the louder failure while the quiet one shipped. The
            # else-branch below closes that.
            if [ -f src/backend/enterprise/backend/__init__.py ]; then
              if printf '%s\n' "$BOOT_LOG" | grep -q 'Trinity Enterprise registration FAILED'; then
                echo "::error::Enterprise registration FAILED — the submodule is mounted but this instance is running OSS-only (every entitled route will 403). See trinity#2068."
                printf '%s\n' "$BOOT_LOG" | grep -A 20 'Trinity Enterprise registration FAILED' | head -40
                exit 1
              elif printf '%s\n' "$BOOT_LOG" | grep -q 'Trinity Enterprise modules registered'; then
                echo "ENTERPRISE: modules registered"
              else
                echo "::error::Enterprise submodule is mounted but the backend never printed 'Trinity Enterprise modules registered' — registration did not complete. See trinity#2068."
                printf '%s\n' "$BOOT_LOG" | grep -i 'enterprise' | tail -20
                exit 1
              fi
              # Partial degradation: registration finished, but some modules
              # failed — the success line still prints. Out of scope for #2068
              # and not a deploy blocker on its own, so warn rather than fail;
              # failing on it deserves its own decision.
              if printf '%s\n' "$BOOT_LOG" | grep -q 'FAILED module(s)'; then
                echo "::warning::Enterprise registration completed with FAILED module(s) — some entitled features are unavailable on this instance"
                printf '%s\n' "$BOOT_LOG" | grep 'FAILED module(s)' | head -5
              fi
            else
              # #2246 — an unentitled dev instance is a FAILED deploy, not a
              # degraded one, and this is the deliberate decision the issue asked
              # for. Reasoning, so a future reader can disagree on the record:
              #
              #  * dev exists to exercise what prod will run. With the submodule
              #    unmounted, `enterprise_features` is empty, every
              #    `requires_entitlement` route 403s, and gated Vue stays hidden —
              #    so the recorded gitlink is never exercised anywhere before prod.
              #    That is a release-time pointer surprise waiting to happen, and
              #    it silently voids dev as a validation surface for every
              #    enterprise-tracker issue.
              #  * it hid for weeks BECAUSE it was only a ::warning::. Warnings do
              #    not change a run's conclusion, and nobody reads a green run's
              #    log. 200 consecutive runs carried it.
              #  * #847's rule — a private submodule must never break OSS — is
              #    about the OSS *build*, and it still holds: it is enforced by
              #    build-without-submodule.yml and by the conditional import in
              #    main.py. This workflow deploys the core team's dev VM, where
              #    the submodule is expected; asserting that here does not weaken
              #    the OSS guarantee anywhere.
              #
              # It fails at the END, deliberately, not at the submodule step: the
              # pull has already happened, so aborting early would leave the VM
              # half-updated and fix nothing. The instance comes up, gets health-
              # checked, and THEN the run goes red with an accurate reason.
              #
              # Escape hatch without editing this file: set the repo variable
              # DEPLOY_ALLOW_OSS_ONLY=true to demote this back to a warning (for a
              # VM that legitimately has no enterprise access).
              if [ "${{ vars.DEPLOY_ALLOW_OSS_ONLY }}" = "true" ]; then
                echo "::warning::Deployed in OSS-only mode — enterprise submodule not mounted (allowed by DEPLOY_ALLOW_OSS_ONLY)"
              else
                echo "::error::Deployed in OSS-only mode — the enterprise submodule is NOT mounted, so this instance runs unentitled: enterprise_features is empty and every requires_entitlement route 403s. See the ENTERPRISE: lines above for the classified cause, and trinity#2246."
                exit 1
              fi
            fi

            echo "=== Agent seeding check (#2204) ==="
            # A green deploy is not evidence the instance is CORRECT. Agent
            # creation failures are logged, never raised, so this workflow can
            # report success with the fleet incomplete -- observed 2026-08-15,
            # when a seeded agent lost an SSH port race (#2215) and was simply
            # never created while the deploy stayed green.
            #
            # Same precedent as the enterprise-registration grep above: assert
            # on post-deploy STATE, not on the job's conclusion. That is the
            # difference between this and the `Error check` below, which ends in
            # `|| echo "No errors"` and therefore only ever PRINTS.
            #
            # This cannot wedge the pipeline. Seeding is first-run-only behind
            # the durable `cornelius_seeded` / `default_system_seeded` flags, and
            # BOOT_LOG is scoped to the current container run -- so this fails
            # exactly once, on the deploy that actually left the instance
            # incomplete, and later deploys are clean.
            if printf '%s\n' "$BOOT_LOG" | grep -q 'Failed to create agent'; then
              echo "::error::An agent failed to be created during boot -- this instance is running with an incomplete fleet. See trinity#2215."
              printf '%s\n' "$BOOT_LOG" | grep 'Failed to create agent' | head -10
              exit 1
            fi
            echo "No agent creation failures."

            echo "=== Error check ==="
            sudo docker logs trinity-backend --tail 50 2>&1 | grep -iE 'error|exception|failed' | head -10 || echo "No errors"

            echo "=== Done ==="

  # #2204: a red deploy must not be able to run silently. 39 consecutive
  # failures over five days produced no alert, no issue, and no signal on any of
  # the ~39 PRs that merged into the broken branch -- the SECOND occurrence of
  # that class (the first ran four days / thirty merges).
  #
  # Deliberately a separate JOB, not a step inside the deploy script. An alert
  # sent from inside the SSH session shares a failure domain with the thing it
  # is alerting on: Tailscale down, SSH refused, or a wedged host means no
  # alert at all, precisely when one is most needed. A job-level `if: failure()`
  # fires even when the host is unreachable.
  #
  # A Slack webhook was considered and REJECTED: no webhook secret exists in
  # this repo or at org level, so `secrets.SLACK_WEBHOOK_URL` would render empty
  # and the step would no-op silently -- the packaging-gap class recorded six
  # times in docs/memory/learnings.md (#1039, #1056, #1707, #1871, ent#14,
  # ent#31). An alert that silently never fires is worse than none, because it
  # retires the concern. GITHUB_TOKEN needs no provisioning and cannot ship
  # inert. If a webhook secret is added later, a sibling step is trivially
  # additive -- but it must not REPLACE this one, for the failure-domain reason
  # above.
  #
  # `if: failure()` deliberately does NOT fire on `cancelled`: with
  # cancel-in-progress:false a superseded PENDING run is cancelled, and that is
  # not a deploy failure. (See learnings.md 2026-07-28 on `if: always()` +
  # a cancelled clause silently defeating cancel-in-progress.)
  notify-failure:
    needs: deploy
    if: failure()
    runs-on: ubuntu-latest
    # Job-level `permissions:` REPLACES the workflow-level block, so this grant
    # is scoped to this job alone; the deploy job keeps `contents: read`.
    # Elevation works despite the repo default of read-only -- claim.yml
    # already relies on it.
    permissions:
      issues: write
    steps:
      - name: File a deploy-failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -uo pipefail

          # ONE open issue at a time. Re-filing per failure would have produced
          # 39 issues during the outage this fixes; commenting per failure would
          # have produced 39 notifications. An open issue IS the signal, so a
          # further failure while one is open is a deliberate no-op.
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" \
            --label deploy-failure --state open \
            --json number --jq '.[0].number // empty' 2>/dev/null || true)

          if [ -n "$EXISTING" ]; then
            echo "Deploy failure already tracked at #${EXISTING} -- not re-filing."
            exit 0
          fi

          cat > /tmp/deploy-failure-body.md <<BODY
          ## Summary

          \`Deploy to Dev\` failed. This issue was filed automatically by the
          workflow itself, so that a red deploy cannot run silently (trinity#2204).

          - **Failed run**: ${RUN_URL}
          - **Commit**: \`${COMMIT_SHA}\`

          ## What this means

          The dev instance is **not** running this commit. Every merge to
          \`dev\` from now until this is fixed ships nothing, and no other
          signal will report that -- CI stays green and PRs merge cleanly.

          ## First checks

          1. Open the failed run above and read the last \`===\` section header
             reached. The deploy script is sectioned (\`Pull\`, \`Build\`,
             \`Restart\`, \`Health\`, \`Agent seeding check\`) so the header
             names the stage.
          2. If it failed at \`Agent seeding check\`, the instance is up but its
             fleet is incomplete -- see trinity#2215.
          3. If it failed at \`Restart\` with a container-name conflict, the
             reaper should have cleared it; check whether the pattern matched.
          4. If it failed at \`Health\`, the backend is not becoming healthy.
             Check \`docker logs trinity-backend\` on the host -- a database
             that cannot be opened crash-loops every worker before uvicorn
             binds, and the other services then sit in \`Created\` behind
             \`depends_on: service_healthy\`.

          ## Closing this issue

          Close it once a \`Deploy to Dev\` run is green. While it stays open,
          further failures will **not** file duplicates, so do not leave it open
          after the deploy recovers -- a stale open issue suppresses the alert
          for the next outage.
          BODY

          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "bug(ci): Deploy to Dev is failing on \`dev\`" \
            --label "deploy-failure,priority-p1,type-bug,status-ready,theme-infrastructure" \
            --body-file /tmp/deploy-failure-body.md
