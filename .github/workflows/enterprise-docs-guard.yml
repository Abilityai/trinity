# Enterprise-docs disclosure guard (trinity-enterprise#45)
#
# Fails the build if a public doc — OR a public open-core SEAM FILE — reintroduces
# enterprise/paid-feature specifics: named paid features (SIEM/SCIM/...), private
# `enterprise_*` table/schema identifiers, or per-module internals. Public docs and
# seam-file comments may describe the GENERIC open-core seam only (entitlement
# registry + conditional module registration) — never the catalog of which
# capabilities are paid.
#
# Seam files are grepped because a comment there is unguarded prose that can name
# the paid catalog just as a doc can (#1461 — the register_enterprise loader comment
# was the one public enumeration of the module catalog for months).
#
# Out of scope by design: point-in-time historical records
# (docs/archive/**, docs/releases/**, docs/security-reports/**) — those are
# covered by the separate git-history-scrub follow-up, not this forward guard.
name: enterprise-docs-guard

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'CLAUDE.md'
      - 'src/backend/main.py'
      - 'src/backend/services/entitlement_service.py'
      - 'src/backend/services/a2a_gate.py'
      - 'src/backend/services/a2a_outbound.py'
      - 'src/backend/services/runtime_secret_scrub.py'
      - '.github/workflows/enterprise-docs-guard.yml'
  push:
    branches: [dev, main]
    paths:
      - 'docs/**'
      - 'CLAUDE.md'
      - 'src/backend/main.py'
      - 'src/backend/services/entitlement_service.py'
      - 'src/backend/services/a2a_gate.py'
      - 'src/backend/services/a2a_outbound.py'
      - 'src/backend/services/runtime_secret_scrub.py'

# Least privilege: the guard only checks out and greps — no writes.
permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Scan live public docs + open-core seam files for enterprise disclosure
        run: |
          set -uo pipefail
          # Genuinely-private identifiers. Two families:
          #
          #  1. Private module names with no OSS meaning (SIEM, SCIM,
          #     permissions_matrix, two_factor). `client_portal` was here until
          #     ent#356 moved that module into OSS core — it is now a public
          #     package (`src/backend/client_portal/`) mounted unconditionally in
          #     main.py, so forbidding the token would fail the build on the OSS
          #     code itself. NOTE: a guard must name what it
          #     forbids, and this file is public — so every token here is one that is
          #     ALREADY public elsewhere (permissions_matrix + SIEM +
          #     SCIM ship in the OSS Vue bundle; two_factor was in this guard's
          #     previous pattern). Adding a token that is *not* already public would
          #     make the guard itself the disclosure — don't. Deliberately ABSENT:
          #     `SSO` (public GitHub-PAT docs legitimately say "SSO authorization
          #     required"), `retention` / `audit` / `user management` (all name OSS
          #     subsystems — the cleanup sweeps, the OSS audit log, the Settings
          #     role UI). Guarding those would false-fire on core docs.
          #  2. Private SCHEMA — any `enterprise_*` identifier. Generic on purpose
          #     (trinity-enterprise#151): the previous explicit list could not see a
          #     table that shipped after it was written. Four names are OSS-legitimate
          #     and allowlisted below; add to the allowlist only with a reason.
          #
          # Allowlist rationale:
          #   enterprise_features         — the OSS feature-flag field (/api/version,
          #                                 /api/settings/feature-flags). Public by design.
          #   enterprise_schema_migrations— the two-track migration runner's tracking
          #                                 table. Invariant #3 documents the MECHANISM.
          #   enterprise_connectors*      — an OSS table. The MCP connector went
          #                                 OSS-core in #118; the name was kept to avoid
          #                                 a migration.
          #   enterprise_docs             — the ENTERPRISE_DOCS.md filename in pointers.
          #   enterprise_registered       — the OSS `app.state` seam flag in main.py.
          #
          # PCRE (-P) is required for the negative lookahead.
          # `enterprise_portal_*` / `enterprise_client_blocks` are exempted with the
          # same reasoning: ent#356 moved those TABLES onto the OSS track, and their
          # `enterprise_` prefix is retained history (renaming them would be a data
          # migration on every existing install), not a private-schema disclosure.
          # `enterprise_rooms` / `enterprise_room_participants` /
          # `enterprise_room_messages` join them for exactly the same reason
          # (ent#443 moved the rooms module to OSS core). Named one by one rather
          # than as a `room` prefix: the exemption should cover the three tables
          # that actually moved, so a future private `enterprise_room_*` table
          # would still trip the guard.
          PATTERN='\bSIEM\b|\bSCIM\b|\bpermissions_matrix\b|\btwo_factor\b|2fa_recovery_codes|\benterprise_(?!features\b|schema_migrations\b|connectors|docs\b|registered\b|portal_|client_blocks\b|rooms\b|room_participants\b|room_messages\b)[a-z_]+'
          # The open-core seam files: public code whose comments must stay generic
          # (the entitlement mechanism), never naming the paid catalog (#1461).
          # `a2a_outbound.py` (#736) is the newest seam: it resolves outbound A2A
          # targets, and its docstring necessarily discusses which side owns the
          # registry — exactly the prose that drifts into naming a paid catalog.
          # `runtime_secret_scrub.py` (ent#279) is a mechanism-only staging/scrub
          # seam; its module docstring must describe only the generic mechanism
          # and never name the private producer that stages values.
          SEAM_FILES='src/backend/main.py src/backend/services/entitlement_service.py src/backend/services/a2a_gate.py src/backend/services/a2a_outbound.py src/backend/services/runtime_secret_scrub.py'
          # Live docs only — exclude historical/point-in-time trees and this guard.
          # docs/ is recursive, so docs/user-docs/** (which auto-publishes to a public
          # search index via sync-docs-to-vertex.yml) is covered here too.
          HITS=$(grep -rniP "$PATTERN" docs/ CLAUDE.md $SEAM_FILES \
                   --exclude-dir=archive \
                   --exclude-dir=releases \
                   --exclude-dir=security-reports \
                   2>/dev/null || true)
          if [ -n "$HITS" ]; then
            echo "::error::Enterprise/paid-feature detail found in a public doc or seam file (trinity-enterprise#45)."
            echo "Public docs and seam-file comments describe the generic open-core seam only. Move specifics to trinity-enterprise/docs/."
            echo "--------------------------------------------------------------------"
            echo "$HITS"
            exit 1
          fi
          echo "OK — no enterprise/paid-feature disclosure in live public docs or seam files."
