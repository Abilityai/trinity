name: frontend-build

on:
  pull_request:
    paths:
      - 'src/frontend/**'
      # #2964: previewTitle's contract with the server's clean_title (vitest twin).
      - 'tests/fixtures/portal-work-titles.json'
      # trinity-enterprise#1117: the Credentials panel's .env encoding contract
      # with the agent's readers (vitest twin of test_ent1117_s11_env_escape_table.py).
      - 'tests/fixtures/ent1117-env-escape-cases.json'
      - 'tests/fixtures/ent1117-env-legacy-reads.json'
      - '.github/workflows/frontend-build.yml'
  push:
    branches: [main, dev]
    paths:
      - 'src/frontend/**'
      # #2964: previewTitle's contract with the server's clean_title (vitest twin).
      - 'tests/fixtures/portal-work-titles.json'
      # trinity-enterprise#1117: the Credentials panel's .env encoding contract
      # with the agent's readers (vitest twin of test_ent1117_s11_env_escape_table.py).
      - 'tests/fixtures/ent1117-env-escape-cases.json'
      - 'tests/fixtures/ent1117-env-legacy-reads.json'
      - '.github/workflows/frontend-build.yml'

# CSO M9: least-privilege token — this workflow only reads the checkout.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/frontend/package-lock.json

      - run: npm ci

      - name: Verify design tokens
        run: npm run check:tokens

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build
