name: dev-nightly

# Tier 3 (#2945): the deep checks, nightly, on `dev` ITSELF.
#
# Before this file, `dev` was never the subject of a scheduled run — only the
# BASE side of `backend-unit-nightly` / `integration-nightly`, which sweep open
# PRs and report the diff. A base that is red in the same way on both sides is
# invisible there, and on a day with no open PRs nothing runs at all. This
# workflow asks the absolute question of `dev` every night:
#
#   unit         the 3-seed pytest-randomly matrix the PR gate no longer runs
#                (Tier 1 runs one seed; #2945's explicit trade), each seed
#                compared against the committed failure baseline;
#   integration  the live-stack suite (`tests/` minus unit/ and process_engine/)
#                against a stack booted from `dev`, absolute failures reported.
#
# A red night opens or updates ONE tracking issue (the frontend-e2e nightly
# precedent, #1526) so it has an owner by morning, and every scheduled run —
# green or red — posts ONE Slack message (`notify-slack`, incoming webhook in
# the `SLACK_WEBHOOK_URL` secret; skipped with a notice when unset). Tier 3
# findings that nobody reads are the failure mode of moving tests off the PR —
# the morning message is the reader.
#
# `schedule` runs the workflow file from the DEFAULT branch, so every checkout
# below names `ref: dev` explicitly (the P-20b trap).

on:
  schedule:
    - cron: '0 5 * * *'   # 05:00 UTC — before the PR sweeps (06:00 unit, 06:30 integration)
  workflow_dispatch:
    inputs:
      slack:
        description: 'Also post the Slack message (scheduled runs always do)'
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  group: dev-nightly
  cancel-in-progress: false

jobs:
  unit:
    name: pytest (dev, seed ${{ matrix.seed }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        seed: [12345, 67890, 99999]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: tests/requirements-test.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements-test.txt \
            'pytest-randomly>=3.15.0' 'pytest-xdist>=3.5.0'

      - name: Checker self-test
        run: python scripts/ci/check-failure-baseline.py --self-test

      - name: Run unit suite
        # Same flags as backend-unit-test.yml's head run (see its comment block).
        run: |
          cd tests
          python -m pytest unit/ -m "not slow" \
            --timeout=300 --timeout-method=signal \
            -n auto --dist loadfile \
            -p randomly --randomly-seed=${{ matrix.seed }} \
            --junit-xml="$GITHUB_WORKSPACE/junit-dev-${{ matrix.seed }}.xml" \
            --tb=no -q || true

      - name: Compare against the committed baseline
        run: |
          python scripts/ci/check-failure-baseline.py \
            --xml junit-dev-${{ matrix.seed }}.xml \
            --baseline tests/unit_failure_baseline.txt \
            --out "$GITHUB_STEP_SUMMARY"

      - name: Upload JUnit XML
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-dev-${{ matrix.seed }}
          path: junit-dev-${{ matrix.seed }}.xml
          if-no-files-found: warn
          retention-days: 14

  integration:
    name: live integration (dev)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: tests/requirements-test.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements-test.txt
          pip install -e ./src/cli

      - name: Generate CI admin password
        run: |
          set -euo pipefail
          PASS="$(openssl rand -base64 24 | tr -d '/+=\n')Aa1!"
          echo "::add-mask::$PASS"
          echo "ADMIN_PASSWORD=$PASS" >> "$GITHUB_ENV"

      - name: Run the live suite on dev
        # The stack boot and the pytest selection mirror integration-nightly.yml;
        # only the subject differs (dev itself, one side, absolute failures).
        env:
          ANTHROPIC_API_KEY: placeholder
          TRINITY_API_URL: http://localhost:8000
          TRINITY_TEST_CLEANUP_SWEEP: '1'
        run: |
          set -uo pipefail
          cp .env.example .env
          echo "ADMIN_PASSWORD=$ADMIN_PASSWORD" >> .env
          echo "ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY" >> .env
          echo "SECRET_KEY=$(openssl rand -hex 32)" >> .env
          echo "TRINITY_DEFAULT_SYSTEM_MANIFEST=disabled" >> .env
          ./scripts/deploy/start.sh
          healthy=0
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:8000/health >/dev/null 2>&1; then healthy=1; break; fi
            sleep 2
          done
          if [ "$healthy" != "1" ]; then
            echo "::error::backend never became healthy — harness failure, not a test result"
            docker compose down -v --remove-orphans || true
            exit 1
          fi
          ( cd tests && python -m pytest -m "not slow" \
              --ignore=unit --ignore=process_engine \
              --continue-on-collection-errors \
              --timeout=300 --timeout-method=signal \
              --junit-xml="$GITHUB_WORKSPACE/junit-integration-dev.xml" \
              --tb=short -q ) || true
          docker compose down -v --remove-orphans || true
          if [ ! -s "$GITHUB_WORKSPACE/junit-integration-dev.xml" ]; then
            echo "::error::no JUnit XML — the stack never ran the suite. Failing closed."
            exit 1
          fi

      - name: Report absolute failures
        # No tolerated-failure list for the live tier: the first runs establish
        # what dev's integration state actually is, and a red here is read by a
        # human via the issue below rather than baselined away.
        run: |
          python scripts/ci/check-failure-baseline.py \
            --xml junit-integration-dev.xml \
            --out "$GITHUB_STEP_SUMMARY"

      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=300 > trinity-logs-dev.txt || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-dev
          path: |
            junit-integration-dev.xml
            trinity-logs-dev.txt
          if-no-files-found: warn
          retention-days: 14

  report:
    name: red-night tracking issue
    needs: [unit, integration]
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Upsert or close the tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          UNIT: ${{ needs.unit.result }}
          INTEGRATION: ${{ needs.integration.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TITLE="dev-nightly red: Tier 3 failed on dev"
          existing=$(gh issue list --repo "$REPO" --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number // empty')
          if [ "$UNIT" = "success" ] && [ "$INTEGRATION" = "success" ]; then
            if [ -n "$existing" ]; then
              gh issue close "$existing" --repo "$REPO" --comment "Tier 3 green again — [run]($RUN_URL)."
            fi
            exit 0
          fi
          body=$(cat <<EOF
          **Tier 3 red on \`dev\`** — unit: \`$UNIT\` · integration: \`$INTEGRATION\` — [run]($RUN_URL).

          The PR gate (Tier 1) runs one seed and no live tier by design (#2945); this is where those classes surface. Read the step summaries for the failing test IDs, attribute to a squash commit since the last \`dev-green\` tag, and fix forward or revert. Closes itself on the next green night.
          EOF
          )
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPO" --body "$body"
          else
            gh issue create --repo "$REPO" --title "$TITLE" --body "$body" \
              --label priority-p1 --label type-bug --label theme-reliability
          fi

  notify-slack:
    name: morning Slack message
    needs: [unit, integration, report]
    # One message per scheduled night, green or red — the team asked for exactly
    # one alert to read in the morning, not a silence that could mean "green" or
    # "never ran". Dispatch runs stay quiet unless asked (input below), so a
    # test of this workflow does not page the channel.
    if: always() && (github.event_name == 'schedule' || inputs.slack == true)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: read
    steps:
      - name: Post the verdict
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          UNIT: ${{ needs.unit.result }}
          INTEGRATION: ${{ needs.integration.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "::notice::SLACK_WEBHOOK_URL is not set — no Slack message (add an Incoming Webhook secret to enable)"
            exit 0
          fi
          tip=$(gh api "repos/$REPO/commits/dev" --jq '.sha[0:8]')
          if [ "$UNIT" = "success" ] && [ "$INTEGRATION" = "success" ]; then
            text=":white_check_mark: *dev-nightly green* — \`dev@${tip}\` · unit 3/3 seeds · live integration ok · <${RUN_URL}|run>"
          else
            issue=$(gh issue list --repo "$REPO" --state open --search '"dev-nightly red" in:title' --json number,url --jq '.[0] | "<\(.url)|#\(.number)>"' 2>/dev/null || true)
            text=":red_circle: *dev-nightly red* — \`dev@${tip}\` · unit: \`${UNIT}\` · integration: \`${INTEGRATION}\` · <${RUN_URL}|run>${issue:+ · issue ${issue}}"
          fi
          # Plain incoming webhook, no third-party action to pin: jq builds the
          # JSON so the text cannot break the payload.
          jq -n --arg text "$text" '{text: $text}' \
            | curl -fsS -X POST -H 'Content-Type: application/json' --data @- "$SLACK_WEBHOOK_URL" >/dev/null
          echo "posted: $text" >> "$GITHUB_STEP_SUMMARY"
